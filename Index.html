<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Find Nearby Stores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tight text-gray-900">Smart<span class="text-orange-600">Shop</span></h1>
            <div class="space-x-3">
                <a href="login.html" class="text-sm font-bold text-gray-600 hover:text-orange-600">Vendor Login</a>
                <a href="vendorhome.html" class="text-sm font-bold bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-black transition">Create Store</a>
            </div>
        </div>
    </header>

    <section class="bg-gradient-to-br from-orange-500 to-red-500 py-16 px-4">
        <div class="max-w-3xl mx-auto text-center space-y-6">
            <h2 class="text-4xl md:text-5xl font-black text-white leading-tight">
                Aapke ghar ke paas ki dukaano ka saman, ab online. 🛍️
            </h2>
            <p class="text-orange-100 font-medium">Search products and find them in stores just minutes away from you!</p>
            
            <div class="bg-white p-2 rounded-2xl shadow-xl flex flex-col md:flex-row gap-2 mt-8">
                
                <button id="locBtn" class="flex items-center justify-center gap-2 px-4 py-3 bg-gray-100 rounded-xl text-sm font-bold text-gray-700 hover:bg-gray-200 transition whitespace-nowrap">
                    📍 <span id="locText">Detect Location</span>
                </button>
                
                <!-- 🌟 NAYA FEATURE: Category Dropdown -->
                <select id="categorySelect" class="px-4 py-3 bg-gray-50 border border-gray-100 outline-none text-gray-700 font-bold rounded-xl md:w-48 focus:ring-2 focus:ring-orange-500 transition cursor-pointer">
                    <option value="">All Categories</option>
                    <!-- Backend se aane wali categories yahan load hongi -->
                </select>
                
                <input type="text" id="searchInput" placeholder="Search for headphones, shoes, groceries..." class="flex-1 px-4 py-3 bg-transparent outline-none text-gray-800 font-medium placeholder-gray-400 border-t border-gray-100 md:border-t-0 md:border-l">
                
                <button id="searchBtn" class="bg-orange-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-700 transition">
                    Search
                </button>
            </div>
        </div>
    </section>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-12 w-full">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-extrabold text-gray-900" id="resultTitle">Trending Nearby Products 🔥</h3>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
            <p class="text-gray-500 col-span-full text-center py-10 font-medium">Click Search to find products near you.</p>
        </div>
    </main>

    <script>
    const API_URL = '';

    let userLat = null;
    let userLng = null;

    // 🌟 NAYA FEATURE: Load Dynamic Categories
    // Ye function backend se saari unique categories layega (taaki nayi added categories automatically dikhein)
    async function loadCategories() {
        try {
            // Yahan hum man ke chal rahe hain ki backend me ek naya route banega: GET /api/categories
            const res = await fetch(`${API_URL}/api/categories`);
            if (res.ok) {
                const categories = await res.json();
                const select = document.getElementById('categorySelect');
                
                categories.forEach(cat => {
                    // Agar category blank nahi hai tabhi add karein
                    if(cat && cat.trim() !== '') {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat;
                        select.appendChild(option);
                    }
                });
            }
        } catch (error) {
            console.error("Categories load karne mein error:", error);
            // Fallback categories agar API fail ho jaye
            const defaultCategories = ["Mobile Accessories", "General Store", "Electronics", "Groceries", "Clothing"];
            const select = document.getElementById('categorySelect');
            defaultCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }
    }

    // Page load hote hi categories le aao
    loadCategories();

    // 📍 1. GET USER LOCATION
    document.getElementById('locBtn').addEventListener('click', () => {
        const locText = document.getElementById('locText');
        locText.innerText = "Locating... ⏳";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    locText.innerText = "Location Set ✅";
                    document.getElementById('locBtn').classList.replace('bg-gray-100', 'bg-green-100');
                    document.getElementById('locBtn').classList.replace('text-gray-700', 'text-green-700');
                    
                    triggerSearch(); 
                },
                (error) => {
                    alert("⚠️ Location permission denied! Hum default search dikhayenge.");
                    locText.innerText = "Location Blocked ❌";
                    triggerSearch();
                }
            );
        } else {
            alert("Browser doesn't support geolocation.");
        }
    });

    // 🔍 2. SEARCH PRODUCTS
    function triggerSearch() {
        const query = document.getElementById('searchInput').value.trim();
        const category = document.getElementById('categorySelect').value; // 🌟 Category nikal li
        fetchProducts(query, category);
    }

    document.getElementById('searchBtn').addEventListener('click', triggerSearch);

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') triggerSearch();
    });

    // 🌟 Dropdown change hone par bhi turant search ho jaye
    document.getElementById('categorySelect').addEventListener('change', triggerSearch);

    // 🛍️ 3. FETCH & RENDER DATA
    async function fetchProducts(searchQuery, category = "") {
        const grid = document.getElementById('productsGrid');
        const title = document.getElementById('resultTitle');
        
        grid.innerHTML = `<p class="col-span-full text-center py-10 text-orange-600 font-bold animate-pulse">Searching nearby stores... ⏳</p>`;
        
        // Title update karne ka logic
        let titleText = `Trending Nearby Products 🔥`;
        if (searchQuery || category) {
            titleText = `Results `;
            if (searchQuery) titleText += `for "${searchQuery}" `;
            if (category) titleText += `in "${category}" `;
            titleText += `🎯`;
        }
        title.innerText = titleText;

        try {
            // 🌟 Body mein category pass kar di gayi hai
            const res = await fetch(`${API_URL}/api/customer/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    latitude: userLat, 
                    longitude: userLng, 
                    searchQuery: searchQuery,
                    category: category // Naya parameter
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Server Error (${res.status}): ${errText}`);
            }

            const data = await res.json();

            if (data.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-gray-500 font-medium">Koi saaman nahi mila. Kuch aur search karke dekhein! 😔</p>`;
                return;
            }

            grid.innerHTML = data.map(item => {
                let distanceHtml = '';
                if (item.distance !== undefined && item.distance !== null && userLat) {
                    distanceHtml = `<span class="text-[10px] font-extrabold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-100">📍 ${item.distance.toFixed(1)} KM away</span>`;
                }

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition overflow-hidden group flex flex-col">
                    <div class="relative h-40 overflow-hidden bg-gray-50">
                        <img src="${item.images && item.images[0] ? item.images[0] : 'https://via.placeholder.com/150'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h4 class="font-bold text-gray-900 text-sm line-clamp-2 mb-1">${item.name}</h4>
                        <p class="text-xs font-medium text-gray-500 mb-2 truncate">🏪 ${item.shopName}</p>
                        
                        <div class="mt-auto">
                            <div class="flex justify-between items-end mb-3">
                                <span class="font-black text-orange-600 text-lg">₹${item.price}</span>
                                ${distanceHtml}
                            </div>
                            <a href="/shop.html?store=${item.shopSlug}" target="_blank" class="block w-full text-center bg-gray-900 text-white font-bold text-xs py-2.5 rounded-xl hover:bg-black transition">
                                Visit Store ↗
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');

        } catch (err) {
            console.error("Fetch Error:", err);
            grid.innerHTML = `<p class="col-span-full text-center py-10 text-red-500 font-bold">⚠️ ${err.message}</p>`;
        }
    }

    // Initial Load
    fetchProducts('', '');
    </script>
</body>
</html>
