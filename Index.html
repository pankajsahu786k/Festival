<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9QFPH9J8TG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9QFPH9J8TG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Find Nearby Stores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        .tab-active { background-color: #111827; color: white; border-color: #111827; }
        .tab-inactive { background-color: white; color: #374151; border-color: #e5e7eb; }
        
        .diet-active { background-color: #ea580c; color: white; border-color: #ea580c; }
        .diet-inactive { background-color: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tight text-gray-900">Smart<span class="text-orange-600">Shop</span></h1>
            <div class="space-x-3">
                <a href="login.html" class="text-sm font-bold text-gray-600 hover:text-orange-600">Vendor Login</a>
                <a href="vendorhome.html" class="text-sm font-bold bg-gray-900 text-white px-4 py-2 rounded-lg hover:bg-black transition">Create Store</a>
            </div>
        </div>
    </header>

    <section class="bg-gradient-to-br from-orange-500 to-red-500 py-12 px-4">
        <div class="max-w-4xl mx-auto text-center space-y-6">
            <h2 class="text-4xl md:text-5xl font-black text-white leading-tight">
                Aapke ghar ke paas ki dukaano ka saman, ab online. 🛍️
            </h2>
            <p class="text-orange-100 font-medium">Search products & services in stores just minutes away from you!</p>
            
            <div class="flex flex-wrap justify-center gap-3 mt-8 mb-4">
                <button onclick="switchTab('retail')" id="btn-retail" class="tab-active px-6 py-2.5 rounded-full font-bold text-sm border-2 shadow-md transition transform hover:scale-105">🛍️ Retail / Saman</button>
                <button onclick="switchTab('food')" id="btn-food" class="tab-inactive px-6 py-2.5 rounded-full font-bold text-sm border-2 shadow-sm transition transform hover:scale-105">🍔 Food Outlet</button>
                <button onclick="switchTab('service')" id="btn-service" class="tab-inactive px-6 py-2.5 rounded-full font-bold text-sm border-2 shadow-sm transition transform hover:scale-105">🛠️ Services</button>
            </div>

            <div class="bg-white p-2 rounded-2xl shadow-xl flex flex-col md:flex-row gap-2">
                
                <button id="locBtn" class="flex items-center justify-center gap-2 px-4 py-3 bg-gray-100 rounded-xl text-sm font-bold text-gray-700 hover:bg-gray-200 transition whitespace-nowrap">
                    📍 <span id="locText">Detect Location</span>
                </button>
                
                <select id="categorySelect" class="px-4 py-3 bg-gray-50 border border-gray-100 outline-none text-gray-700 font-bold rounded-xl md:w-48 focus:ring-2 focus:ring-orange-500 transition cursor-pointer">
                    <option value="">All Categories</option>
                </select>
                
                <input type="text" id="searchInput" placeholder="Search for shoes, clothes, groceries, electronics..." class="flex-1 px-4 py-3 bg-transparent outline-none text-gray-800 font-medium placeholder-gray-400 border-t border-gray-100 md:border-t-0 md:border-l">
                
                <button id="searchBtn" class="bg-orange-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-700 transition">
                    Search
                </button>
            </div>

            <div id="dietFilterSection" class="hidden flex justify-center gap-2 mt-3">
                <span class="text-white text-xs font-bold self-center mr-1">Filter Food:</span>
                <button onclick="setDietFilter('all')" id="diet-all" class="diet-active px-4 py-1.5 rounded-xl font-bold text-xs border transition">All Dishes</button>
                <button onclick="setDietFilter('veg')" id="diet-veg" class="diet-inactive px-4 py-1.5 rounded-xl font-bold text-xs border transition flex items-center gap-1">🟢 Pure Veg</button>
                <button onclick="setDietFilter('non-veg')" id="diet-non-veg" class="diet-inactive px-4 py-1.5 rounded-xl font-bold text-xs border transition flex items-center gap-1">🔴 Non-Veg</button>
            </div>

        </div>
    </section>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-12 w-full">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-extrabold text-gray-900" id="resultTitle">Trending Nearby Products 🔥</h3>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
            <p class="text-gray-500 col-span-full text-center py-10 font-medium">Loading items near you...</p>
        </div>
    </main>

    <script>
    const API_URL = '';

    let userLat = null;
    let userLng = null;
    let currentTab = 'retail';
    let currentDiet = 'all'; 
    let dbDynamicCategories = [];

    const categoryData = {
        retail: [
            "Grocery & Kirana Store", "Clothing & Fashion", "Electronics & Mobile Accessories",
            "Hardware, Paint & Tools", "Medical & Pharmacy", "Footwear & Shoes",
            "Cosmetics & Beauty Products", "Stationery & Books"
        ],
        food: [
            "Restaurant & Dine-in", "Cafe & Coffee Shop", "Bakery & Cake Shop",
            "Fast Food & Snacks", "Sweet Shop (Mithai)", "Juice & Beverages"
        ],
        service: [
            "Salon, Parlour & Spa", "Mobile & Laptop Repair", "Plumber, Electrician & Carpenter",
            "Event, Tent & Decoration", "Real Estate & Brokerage", "Tailor & Boutique"
        ]
    };

    async function loadCategories() {
        try {
            const res = await fetch(`${API_URL}/api/categories`);
            if (res.ok) {
                dbDynamicCategories = await res.json();
            }
        } catch (error) {
            console.error("Categories load karne mein error:", error);
        }
        updateCategoryDropdown(currentTab);
    }

    function updateCategoryDropdown(tabName) {
        const select = document.getElementById('categorySelect');
        select.innerHTML = '<option value="">All Categories</option>';

        if (categoryData[tabName]) {
            categoryData[tabName].forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        let newAdditions = [];
        dbDynamicCategories.forEach(item => {
            if (typeof item === 'object' && item.category && item.storeType) {
                if (item.storeType === tabName && !categoryData[tabName].includes(item.category)) {
                    newAdditions.push(item.category);
                }
            } else if (typeof item === 'string') {
                const allDefaults = [...categoryData.retail, ...categoryData.food, ...categoryData.service];
                if (!allDefaults.includes(item) && item.toLowerCase() !== 'other' && item.trim() !== '') {
                    newAdditions.push(item);
                }
            }
        });

        if (newAdditions.length > 0) {
            newAdditions = [...new Set(newAdditions)];
            const group = document.createElement('optgroup');
            group.label = "🌟 Nayi Categories";
            newAdditions.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                group.appendChild(option);
            });
            select.appendChild(group);
        }
    }

    loadCategories();

    function switchTab(tabName) {
        currentTab = tabName;
        currentDiet = 'all';
        resetDietButtonsUI();
        
        const tabs = ['retail', 'food', 'service'];
        tabs.forEach(t => {
            const btn = document.getElementById(`btn-${t}`);
            if(t === tabName) {
                btn.classList.replace('tab-inactive', 'tab-active');
            } else {
                btn.classList.replace('tab-active', 'tab-inactive');
            }
        });

        const dietBar = document.getElementById('dietFilterSection');
        if (tabName === 'food') {
            dietBar.classList.remove('hidden');
        } else {
            dietBar.classList.add('hidden');
        }

        updateCategoryDropdown(tabName);

        const searchInput = document.getElementById('searchInput');
        if(tabName === 'retail') searchInput.placeholder = "Search for shoes, clothes, groceries, electronics...";
        if(tabName === 'food') searchInput.placeholder = "Search in food outlets (burger, thali, bakery, dishes)...";
        if(tabName === 'service') searchInput.placeholder = "Search services (haircut, plumber, repair)...";

        document.getElementById('searchInput').value = "";
        
        triggerSearch();
    }

    function setDietFilter(dietType) {
        currentDiet = dietType;
        resetDietButtonsUI();
        
        const selectedBtn = document.getElementById(`diet-${dietType}`);
        if(selectedBtn) {
            selectedBtn.classList.replace('diet-inactive', 'diet-active');
        }
        
        triggerSearch();
    }

    function resetDietButtonsUI() {
        ['all', 'veg', 'non-veg'].forEach(d => {
            const b = document.getElementById(`diet-${d}`);
            if(b) {
                b.classList.replace('diet-active', 'diet-inactive');
            }
        });
    }

    document.getElementById('locBtn').addEventListener('click', () => {
        const locText = document.getElementById('locText');
        locText.innerText = "Locating... ⏳";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    locText.innerText = "Location Set ✅";
                    document.getElementById('locBtn').classList.replace('bg-gray-100', 'bg-green-100');
                    document.getElementById('locBtn').classList.replace('text-gray-700', 'text-green-700');
                    triggerSearch(); 
                },
                (error) => {
                    alert("⚠️ Location permission denied! Default view dikha rahe hain.");
                    locText.innerText = "Location Blocked ❌";
                    triggerSearch();
                }
            );
        } else {
            alert("Browser location support nahi karta.");
        }
    });

    function triggerSearch() {
        const query = document.getElementById('searchInput').value.trim();
        const category = document.getElementById('categorySelect').value; 
        fetchProducts(query, category);
    }

    document.getElementById('searchBtn').addEventListener('click', triggerSearch);
    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSearch(); });
    document.getElementById('categorySelect').addEventListener('change', triggerSearch);

    async function fetchProducts(searchQuery, category = "") {
        const grid = document.getElementById('productsGrid');
        const title = document.getElementById('resultTitle');
        
        grid.innerHTML = `<p class="col-span-full text-center py-10 text-orange-600 font-bold animate-pulse">Fetching ${currentTab} items... ⏳</p>`;
        
        let tabLabel = currentTab === 'retail' ? 'Products' : currentTab === 'food' ? 'Food Outlets' : 'Services';
        let titleText = `Top Nearby ${tabLabel} 🔥`;
        if (searchQuery || category) {
            titleText = `Results `;
            if (searchQuery) titleText += `for "${searchQuery}" `;
            if (category) titleText += `in "${category}" `;
            titleText += `🎯`;
        }
        title.innerText = titleText;

        try {
            const res = await fetch(`${API_URL}/api/customer/search`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    latitude: userLat, 
                    longitude: userLng, 
                    searchQuery: searchQuery,
                    category: category
                })
            });

            if (!res.ok) throw new Error(`Server Error`);
            const data = await res.json();

            // 🌟 SMART HYBRID FILTER (Naya Backend Tag + Purana Item Fallback) 🌟
            let finalData = data.filter(item => {
                let itemStoreType = (item.storeType || item.shopStoreType || '').toLowerCase();
                
                // 🛠️ FALLBACK: Agar purana item hai jisme tag nahi hai, toh naam se pehchano!
                if (!itemStoreType || itemStoreType === '') {
                    const catString = (item.category || item.shopCategory || item.shopName || '').toLowerCase();
                    const itemDesc = (item.description || '').toLowerCase();
                    const itemName = (item.name || '').toLowerCase();

                    const isFoodItem = catString.includes('food') || catString.includes('cafe') || catString.includes('restaurant') || catString.includes('bakery') || itemDesc.includes('[veg]') || itemDesc.includes('[non-veg]') || itemName.includes('pizza') || itemName.includes('dosa') || itemName.includes('samosa') || itemName.includes('kachori');
                    const isServiceItem = catString.includes('repair') || catString.includes('salon');

                    if (isFoodItem) itemStoreType = 'food';
                    else if (isServiceItem) itemStoreType = 'service';
                    else itemStoreType = 'retail';
                }

                // Agar item ka tab match nahi kar raha, toh hata do
                if (itemStoreType !== currentTab) return false;

                // Diet Filter for Food Tab
                if (currentTab === 'food' && currentDiet !== 'all') {
                    const itemDesc = (item.description || '').toLowerCase();
                    const isNonVegTag = itemDesc.includes('[non-veg]') || itemDesc.includes('[egg]');
                    
                    if (currentDiet === 'veg') return !isNonVegTag;
                    if (currentDiet === 'non-veg') return isNonVegTag;
                }

                return true;
            });

            if (finalData.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center py-10 text-gray-500 font-medium">Is category / filter me koi item nahi mila. 😔</p>`;
                return;
            }

            grid.innerHTML = finalData.map(item => {
                let distanceHtml = '';
                if (item.distance !== undefined && item.distance !== null && userLat) {
                    distanceHtml = `<span class="text-[10px] font-extrabold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-100">📍 ${item.distance.toFixed(1)} KM away</span>`;
                }

                const itemStoreType = (item.storeType || item.shopStoreType || '').toLowerCase();
                const targetPage = itemStoreType === 'food' ? 'food-shop.html' : 'shop.html';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg transition overflow-hidden group flex flex-col">
                    <div class="relative h-40 overflow-hidden bg-gray-50">
                        <img src="${item.images && item.images[0] ? item.images[0] : 'https://via.placeholder.com/150'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h4 class="font-bold text-gray-900 text-sm line-clamp-2 mb-1">${item.name}</h4>
                        <p class="text-xs font-medium text-gray-500 mb-2 truncate">🏪 ${item.shopName}</p>
                        
                        <div class="mt-auto">
                            <div class="flex justify-between items-end mb-3">
                                <span class="font-black text-orange-600 text-lg">₹${item.price}</span>
                                ${distanceHtml}
                            </div>
                            <a href="/${targetPage}?store=${item.shopSlug}" target="_blank" class="block w-full text-center bg-gray-900 text-white font-bold text-xs py-2.5 rounded-xl hover:bg-black transition">
                                View Details ↗
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');

        } catch (err) {
            console.error("Fetch Error:", err);
            grid.innerHTML = `<p class="col-span-full text-center py-10 text-red-500 font-bold">⚠️ Connection Error</p>`;
        }
    }

    fetchProducts('', '');
    </script>
</body>
</html>
