<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to your Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="font-sans text-gray-900 antialiased flex min-h-screen bg-gray-50">

    <div class="hidden lg:flex w-1/2 bg-gray-950 relative items-center justify-center overflow-hidden">
        <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1200&q=80" 
             alt="Retail Success" class="absolute inset-0 w-full h-full object-cover opacity-25">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/80 to-transparent"></div>
        
        <div class="relative z-10 max-w-lg px-12">
            <div class="mb-10">
                <h1 class="text-4xl font-extrabold text-white tracking-tight">Smart<span class="text-orange-500">Shop</span></h1>
            </div>
            <h2 class="text-4xl font-bold text-white mb-6 leading-tight">
                Welcome Back! <br>
                <span class="text-orange-500 font-medium text-3xl">Apne business par wapas aayein.</span>
            </h2>
            <p class="text-gray-400 text-base leading-relaxed mb-10">
                Apne dashboard me login karein aur apni dukaan ke online orders, customers aur payments ko smart tarike se manage karein.
            </p>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center px-4 py-12 sm:px-12 bg-white">
        <div class="max-w-md w-full">
            
            <div class="lg:hidden text-center mb-8">
                <h1 class="text-3xl font-extrabold text-orange-600 tracking-tight">Smart<span class="text-gray-800">Shop</span></h1>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-8 sm:p-10 shadow-xl shadow-gray-100/70">
                
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Account Sign In</h2>
                    <p class="text-gray-500 text-sm mt-1">Apne credentials daal kar aage badhein.</p>
                </div>

                <div class="mb-6 p-1 bg-gray-100 rounded-xl flex">
                    <button type="button" id="roleVendor" onclick="setRole('vendor')"
                        class="w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-gray-900 shadow-sm">
                        🏪 Vendor
                    </button>
                    <button type="button" id="roleAdmin" onclick="setRole('admin')"
                        class="w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-500 hover:text-gray-900">
                        🛡️ Admin
                    </button>
                </div>

                <form id="loginForm" class="space-y-5">
                    
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">WhatsApp Number</label>
                        <div class="flex rounded-xl border border-gray-200 focus-within:border-orange-500 focus-within:ring-2 focus-within:ring-orange-100 transition duration-200 overflow-hidden bg-gray-50/50">
                            <span class="inline-flex items-center px-4 border-r border-gray-200 bg-gray-50 text-gray-500 text-sm font-medium select-none">
                                +91
                            </span>
                            <input type="tel" id="mobileNumber" placeholder="9876543210" pattern="[0-9]{10}" required
                                class="w-full px-4 py-3.5 bg-transparent outline-none text-sm text-gray-900 font-medium tracking-wide">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-600">Password</label>
                            <a href="#" class="text-xs font-semibold text-orange-600 hover:underline">Forgot?</a>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required
                            class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50/50 focus:bg-white border-gray-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition duration-200 text-sm font-medium">
                    </div>

                    <div class="flex items-center">
                        <input id="remember_me" type="checkbox" class="h-4 w-4 text-orange-600 focus:ring-orange-500 border-gray-300 rounded">
                        <label for="remember_me" class="ml-2 block text-xs font-semibold text-gray-500 select-none">
                            Keep me logged in
                        </label>
                    </div>

                    <button type="submit" 
                        class="w-full bg-orange-600 text-white font-bold text-sm py-4 rounded-xl hover:bg-orange-700 active:scale-[0.99] transition-all duration-150 shadow-md shadow-orange-600/10 mt-4 flex justify-center items-center gap-2 tracking-wide">
                        Sign In Securely 🚀
                    </button>
                    
                </form>

                <p class="text-center text-xs text-gray-500 mt-6 font-medium">
                    New to SmartShop? <a href="signup.html" class="text-orange-600 font-bold hover:text-orange-700 transition">Create an account</a>
                </p>

            </div>

        </div>
    </div>

    <script>
        let selectedRole = 'vendor'; // Default role

        function setRole(role) {
            selectedRole = role;
            const vendorBtn = document.getElementById('roleVendor');
            const adminBtn = document.getElementById('roleAdmin');

            if (role === 'vendor') {
                vendorBtn.className = "w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-gray-900 shadow-sm";
                adminBtn.className = "w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-500 hover:text-gray-900";
            } else {
                adminBtn.className = "w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-gray-900 shadow-sm";
                vendorBtn.className = "w-1/2 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-500 hover:text-gray-900";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = "Authenticating... ⏳";
            submitBtn.disabled = true;

            const mobileNumber = document.getElementById('mobileNumber').value;
            const password = document.getElementById('password').value;

            try {
                // Live Render Login API par data bhejna (role ke saath)
                const response = await fetch('https://festival-h6ff.onrender.com/api/vendor/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mobileNumber, password, role: selectedRole })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('shopSlug', data.shopSlug);

                    alert(`Success: ${data.message}`);
                    
                    // NAYA LOGIC: Check karein ki setup complete hai ya nahi
                    if (!data.isSetupCompleted) {
                        window.location.href = 'setup-shop.html'; // Setup page par bhejein
                    } else {
                        window.location.href = 'dashboard.html'; // Dashboard par bhejein
                    }
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                alert('Network Error! Kripya internet connection check karein.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
