<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop Analytics - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        
        <header class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6">
            <div>
                <h1 class="text-2xl font-black text-gray-900">Store Analytics 📈</h1>
                <p class="text-sm text-gray-500 font-medium mt-1">Real-time performance data & insights</p>
            </div>
            <button onclick="window.history.back()" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl font-bold hover:bg-gray-200 transition shadow-sm">← Back</button>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Total Store Views</p>
                <h3 class="text-3xl font-black text-gray-900 mt-2" id="statViews">--</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Avg Time Spent</p>
                <h3 class="text-3xl font-black text-gray-900 mt-2" id="statTime">--</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-orange-500">
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Total Orders</p>
                <h3 class="text-3xl font-black text-gray-900 mt-2" id="statOrders">--</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
                <p class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Success Rate</p>
                <h3 class="text-3xl font-black text-gray-900 mt-2" id="statConv">--</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col items-center justify-center">
                <h2 class="text-lg font-bold text-gray-900 mb-4 w-full text-left">📊 Most Viewed Products</h2>
                <div class="w-full relative h-[300px]">
                    <canvas id="trendingChart"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">🔥 Trending Items</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-100 bg-gray-50 rounded-lg">
                                <th class="py-3 px-4 text-[10px] font-extrabold text-gray-500 uppercase rounded-tl-lg">Item Name</th>
                                <th class="py-3 px-4 text-[10px] font-extrabold text-gray-500 uppercase rounded-tr-lg text-right">Views 👁️</th>
                            </tr>
                        </thead>
                        <tbody id="trendingTable">
                            <tr><td colspan="2" class="text-center py-6 text-gray-400 text-sm">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopSlug = urlParams.get('store') || localStorage.getItem('shopSlug');

        if(!shopSlug) {
            alert("⚠️ No shop selected!");
            window.location.href = "dashboard.html";
        }

        async function fetchAnalytics() {
            try {
                const res = await fetch(`/api/analytics/dashboard/${shopSlug}`);
                const data = await res.json();

                if(res.ok) {
                    document.getElementById('statViews').innerText = data.views;
                    document.getElementById('statTime').innerText = data.avgTimeSpent;
                    document.getElementById('statOrders').innerText = data.totalOrders;
                    document.getElementById('statConv').innerText = data.conversionRate;

                    renderTable(data.trendingProducts);
                    renderChart(data.trendingProducts);
                }
            } catch (err) {
                console.error("Error fetching analytics", err);
            }
        }

        function renderTable(products) {
            const table = document.getElementById('trendingTable');
            if(products.length === 0) {
                table.innerHTML = `<tr><td colspan="2" class="text-center py-6 text-gray-400 text-sm font-medium bg-gray-50 rounded-b-lg">Abhi tak kisi item ko view nahi kiya gaya hai.</td></tr>`;
                return;
            }
            table.innerHTML = products.map((p, index) => `
                <tr class="border-b border-gray-50 hover:bg-orange-50/50 transition">
                    <td class="py-3 px-4 font-bold text-sm text-gray-800 flex items-center gap-2">
                        <span class="bg-gray-100 text-gray-500 w-5 h-5 flex items-center justify-center rounded text-[10px]">${index + 1}</span> 
                        <span class="truncate max-w-[200px]">${p.name}</span>
                    </td>
                    <td class="py-3 px-4 font-black text-orange-600 text-right">${p.views || 0}</td>
                </tr>
            `).join('');
        }

        function renderChart(products) {
            const ctx = document.getElementById('trendingChart').getContext('2d');
            
            // Labels aur Data alag karna
            const labels = products.map(p => p.name.substring(0, 15) + '...');
            const viewCounts = products.map(p => p.views || 0);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Views',
                        data: viewCounts,
                        backgroundColor: 'rgba(234, 88, 12, 0.8)', // Orange-600
                        borderRadius: 6,
                        barThickness: 30
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        fetchAnalytics();
    </script>
</body>
</html>
