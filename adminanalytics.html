<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Analytics - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex">
        <div class="p-6 border-b border-indigo-800">
            <h1 class="text-2xl font-black tracking-tight">Super<span class="text-blue-400">Admin</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="admin.html" class="block px-4 py-3 hover:bg-indigo-800 rounded-xl font-medium transition text-gray-300">
                ⬅️ Back to Dashboard
            </a>
            
            <a href="adminanalytics.html" class="block px-4 py-3 bg-indigo-600 rounded-xl font-semibold shadow-md flex items-center justify-between mt-4 border border-indigo-500">
                <span>🏆 Top Shops Data</span>
                <span class="bg-blue-400 text-indigo-900 text-[10px] px-2 py-0.5 rounded-full font-black">PRO</span>
            </a>
        </nav>
        <div class="p-4 border-t border-indigo-800">
            <button onclick="adminLogout()" class="w-full px-4 py-3 bg-indigo-800 hover:bg-red-600 rounded-xl font-medium transition text-left">🚪 Logout Boss</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        
        <header class="bg-white shadow-sm px-4 md:px-8 py-5 flex justify-between items-center sticky top-0 z-10 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <a href="admin.html" class="md:hidden bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm border border-gray-200">← Back</a>
                <h2 class="text-xl font-bold text-gray-800">Platform Analytics 📈</h2>
            </div>
            
            <div class="bg-indigo-100 text-indigo-800 px-4 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2">
                <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span> LIVE DATA
            </div>
        </header>

        <div class="p-4 md:p-8 max-w-7xl mx-auto w-full space-y-8">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-indigo-500"></div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total Platform Views</p>
                    <h3 class="text-4xl font-black text-indigo-600 mt-2" id="totalPlatformViews">0</h3>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-blue-500"></div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Active Shops</p>
                    <h3 class="text-4xl font-black text-gray-900 mt-2" id="totalActiveShops">0</h3>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-cyan-500"></div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total Products Hosted</p>
                    <h3 class="text-4xl font-black text-gray-900 mt-2" id="totalProductsHosted">0</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-extrabold text-gray-900 mb-6">🏆 Top 5 Shops (By Customer Scans)</h3>
                    <div class="relative h-[300px]">
                        <canvas id="topShopsChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-extrabold text-gray-900 mb-6">📦 Products per Shop (Top 5)</h3>
                    <div class="relative h-[300px]">
                        <canvas id="productsChart"></canvas>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Security Check
        if (!localStorage.getItem('adminToken')) {
            window.location.href = 'admin.html';
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin.html';
        }

        async function fetchAnalyticsData() {
            try {
                // Fetch Vendors
                const vRes = await fetch('/api/admin/vendors');
                const vendors = await vRes.json();
                
                // Fetch Products
                const pRes = await fetch('/api/admin/products');
                const products = await pRes.json();

                // 1. Calculate Quick Stats
                const activeShops = vendors.filter(v => !v.isSuspended).length;
                let totalViews = 0;
                vendors.forEach(v => { totalViews += (v.shopViews || 0); });

                document.getElementById('totalActiveShops').innerText = activeShops;
                document.getElementById('totalPlatformViews').innerText = totalViews;
                document.getElementById('totalProductsHosted').innerText = products.length;

                // 2. Prepare Data for Charts
                renderTopShopsChart(vendors);
                renderProductsChart(vendors, products);

            } catch (error) {
                console.error("Error fetching analytics data", error);
            }
        }

        function renderTopShopsChart(vendors) {
            const sortedVendors = [...vendors].sort((a, b) => (b.shopViews || 0) - (a.shopViews || 0)).slice(0, 5);
            
            const labels = sortedVendors.map(v => v.shopName);
            const data = sortedVendors.map(v => v.shopViews || 0);

            const ctx = document.getElementById('topShopsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Views / Scans',
                        data: data,
                        backgroundColor: 'rgba(79, 70, 229, 0.9)', // Indigo-600
                        borderRadius: 8,
                        barThickness: 45
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { borderDash: [5, 5] } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderProductsChart(vendors, products) {
            // Count products per shop slug
            const productCounts = {};
            products.forEach(p => {
                productCounts[p.shopSlug] = (productCounts[p.shopSlug] || 0) + 1;
            });

            // Map slugs back to names and sort
            const shopStats = Object.keys(productCounts).map(slug => {
                const shop = vendors.find(v => v.shopSlug === slug);
                return {
                    name: shop ? shop.shopName : slug,
                    count: productCounts[slug]
                };
            }).sort((a, b) => b.count - a.count).slice(0, 5);

            const labels = shopStats.map(s => s.name);
            const data = shopStats.map(s => s.count);

            const ctx = document.getElementById('productsChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#4f46e5', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b'
                        ],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: { legend: { position: 'right' } }
                }
            });
        }

        // Initialize
        fetchAnalyticsData();
    </script>
</body>
</html>
