<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-2xl font-extrabold tracking-tight">Smart<span class="text-orange-500">Shop</span></h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-xl font-medium transition text-white">📊 Dashboard</a>
                <a href="orders.html" class="block px-4 py-3 bg-orange-600 rounded-xl font-semibold shadow-md flex justify-between items-center text-white">
                    <span>📦 Manage Orders</span>
                    <span class="bg-white text-orange-600 text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse">LIVE</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full px-4 py-3 bg-gray-800 hover:bg-red-600 rounded-xl font-medium transition text-left flex items-center gap-2">🚪 Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-xl font-bold text-gray-800">Order Management 🛍️</h2>
            </header>

            <div class="p-8 space-y-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-2xl font-bold text-gray-900">Customer Orders</h3>
                    <button onclick="loadOrders()" class="bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-black transition">🔄 Refresh Orders</button>
                </div>
                <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-gray-400 font-medium">Fetching active orders...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        const shopSlug = localStorage.getItem('shopSlug');

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/orders/${shopSlug}`);
                const orders = await res.json();
                if(orders.length === 0) { container.innerHTML = `<p class="text-gray-400 col-span-3">Abhi tak koi order nahi aaya hai.</p>`; return; }

                container.innerHTML = orders.map(o => `
                    <div class="bg-white p-6 rounded-2xl border ${o.status === 'Pending' ? 'border-orange-300 shadow-md' : 'border-gray-200 opacity-80'} flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-3">
                                <div>
                                    <h4 class="font-black text-lg text-gray-900">${o.customerName}</h4>
                                    <p class="text-[11px] text-gray-500 font-bold uppercase mt-1">${new Date(o.createdAt).toLocaleString()}</p>
                                </div>
                                <span class="px-3 py-1 rounded-md text-xs font-extrabold tracking-wide ${o.status === 'Pending' ? 'bg-orange-100 text-orange-700 animate-pulse' : (o.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')}">${o.status}</span>
                            </div>
                            <ul class="text-sm text-gray-700 mb-5 bg-gray-50 p-3 rounded-xl border border-gray-100 font-medium space-y-2">
                                ${o.items.map(i => `<li class="flex justify-between"><span>▪️ ${i.name} <span class="text-orange-600 font-bold">(x${i.quantity})</span></span> <span class="font-bold text-gray-900">₹${i.price * i.quantity}</span></li>`).join('')}
                            </ul>
                        </div>
                        <div class="border-t pt-4 mt-2">
                            <div class="flex justify-between items-center mb-4"><p class="text-gray-500 text-xs font-bold uppercase">Total Amount</p><p class="font-black text-xl text-gray-900">₹${o.totalAmount}</p></div>
                            ${o.status === 'Pending' ? `
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="updateOrderStatus('${o._id}', 'cancel')" class="py-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold hover:bg-red-100">❌ Cancel</button>
                                    <button onclick="updateOrderStatus('${o._id}', 'complete')" class="py-2.5 bg-green-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-green-700">✅ Confirm</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>`).join('');
            } catch(err) { container.innerHTML = `Error loading orders.`; }
        }

        async function updateOrderStatus(id, action) {
            const endpoint = action === 'complete' ? `/api/orders/complete/${id}` : `/api/orders/cancel/${id}`;
            const confirmMsg = action === 'complete' ? "✅ Confirm order?" : "❌ Cancel order?";
            if(!confirm(confirmMsg)) return;

            try {
                const res = await fetch(`https://festival-h6ff.onrender.com${endpoint}`, { method: 'PUT' });
                if(res.ok) { loadOrders(); }
            } catch (err) { alert("Error."); }
        }

        // ==========================================
        // 🚀 AUTOMATIC 10-SECOND BACKGROUND REFRESH
        // ==========================================
        loadOrders(); 
        setInterval(() => { loadOrdersBackground(); }, 10000);

        async function loadOrdersBackground() {
            const container = document.getElementById('ordersContainer');
            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/orders/${shopSlug}`);
                const orders = await res.json(); if(orders.length === 0) return;

                container.innerHTML = orders.map(o => `
                    <div class="bg-white p-6 rounded-2xl border ${o.status === 'Pending' ? 'border-orange-300 shadow-md' : 'border-gray-200 opacity-80'} flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-3">
                                <div>
                                    <h4 class="font-black text-lg text-gray-900">${o.customerName}</h4>
                                    <p class="text-[11px] text-gray-500 font-bold uppercase mt-1">${new Date(o.createdAt).toLocaleString()}</p>
                                </div>
                                <span class="px-3 py-1 rounded-md text-xs font-extrabold tracking-wide ${o.status === 'Pending' ? 'bg-orange-100 text-orange-700 animate-pulse' : (o.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700')}">${o.status}</span>
                            </div>
                            <ul class="text-sm text-gray-700 mb-5 bg-gray-50 p-3 rounded-xl border border-gray-100 font-medium space-y-2">
                                ${o.items.map(i => `<li class="flex justify-between"><span>▪️ ${i.name} <span class="text-orange-600 font-bold">(x${i.quantity})</span></span> <span class="font-bold text-gray-900">₹${i.price * i.quantity}</span></li>`).join('')}
                            </ul>
                        </div>
                        <div class="border-t pt-4 mt-2">
                            <div class="flex justify-between items-center mb-4"><p class="text-gray-500 text-xs font-bold uppercase">Total Amount</p><p class="font-black text-xl text-gray-900">₹${o.totalAmount}</p></div>
                            ${o.status === 'Pending' ? `
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="updateOrderStatus('${o._id}', 'cancel')" class="py-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold hover:bg-red-100">❌ Cancel</button>
                                    <button onclick="updateOrderStatus('${o._id}', 'complete')" class="py-2.5 bg-green-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-green-700">✅ Confirm</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>`).join('');
            } catch(err) {}
        }

        function logout() { localStorage.clear(); window.location.href = 'Index.html'; }
    </script>
</body>
</html>
