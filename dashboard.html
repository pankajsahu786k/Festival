<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-2xl font-extrabold tracking-tight">Smart<span class="text-orange-500">Shop</span></h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="block px-4 py-3 bg-orange-600 rounded-xl font-semibold shadow-md">📊 Dashboard & Items</a>
                <a href="#" onclick="logout()" class="block px-4 py-3 hover:bg-gray-800 rounded-xl font-medium transition text-red-400">🚪 Logout</a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-xl font-bold text-gray-800">Shop Owner Panel 👋</h2>
                <a href="#" id="storeLink" target="_blank" class="bg-orange-100 text-orange-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-orange-200 transition">View Live Shop 🔗</a>
            </header>

            <div class="p-6 space-y-8">
                
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <div class="lg:col-span-1 bg-white rounded-2xl border border-gray-100 shadow-sm p-6 h-fit">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">➕ Add New Item / Property</h3>
                        
                        <form id="addProductForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Title / Property Name</label>
                                <input type="text" id="prodName" placeholder="E.g. 2 BHK Flat MP Nagar" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Price (₹)</label>
                                    <input type="number" id="prodPrice" placeholder="25000" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Category</label>
                                    <input type="text" id="prodCategory" placeholder="Rent / Sell / Sweets" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">
                                    Upload Gallery Photos <span class="text-orange-600">(Min 3 - Max 5)</span>
                                </label>
                                <input type="file" id="prodGallery" multiple accept="image/*" required
                                    class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl bg-gray-50 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700">
                                <p class="text-[11px] text-gray-400 mt-1">Mobile gallery se 3 se 5 photos select karein.</p>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Full Description</label>
                                <textarea id="prodDesc" rows="3" placeholder="Full details, location, facilities..."
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium"></textarea>
                            </div>

                            <button type="submit" 
                                class="w-full bg-orange-600 text-white font-bold text-sm py-3.5 rounded-xl hover:bg-orange-700 transition shadow-md">
                                Save to Store 🚀
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-900">📦 Your Listed Items / Properties</h3>
                            <button onclick="loadMyProducts()" class="text-xs text-orange-600 font-bold hover:underline">🔄 Refresh List</button>
                        </div>

                        <div id="myProductsList" class="space-y-4">
                            <p class="text-gray-400 text-sm">Loading items...</p>
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-gray-900">Edit Item Details</h3>
            <input type="hidden" id="editProdId">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Title</label>
                <input type="text" id="editName" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Price (₹)</label>
                    <input type="number" id="editPrice" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Category</label>
                    <input type="text" id="editCategory" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Description</label>
                <textarea id="editDesc" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm font-medium"></textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeEditModal()" class="flex-1 py-3 bg-gray-100 font-bold text-gray-600 rounded-xl text-sm">Cancel</button>
                <button onclick="saveProductEdit()" class="flex-1 py-3 bg-orange-600 font-bold text-white rounded-xl text-sm hover:bg-orange-700">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const shopSlug = localStorage.getItem('shopSlug');
        const shopUrl = `https://festival-h6ff.onrender.com/shop.html?store=${shopSlug}`;

        if(shopSlug) {
            const storeLinkEl = document.getElementById('storeLink');
            storeLinkEl.href = shopUrl;
        }

        // Helper: Convert File to Base64 String
        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // ➕ ADD PRODUCT WITH MULTIPLE PHOTOS
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fileInput = document.getElementById('prodGallery');
            const files = Array.from(fileInput.files);

            if (files.length < 3 || files.length > 5) {
                alert("⚠️ Kripya kam se kam 3 aur maximum 5 photos select karein!");
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerText = "Uploading Photos... ⏳";
            submitBtn.disabled = true;

            try {
                // Photos ko Base64 format me convert karna
                const imagePromises = files.map(file => fileToBase64(file));
                const imagesBase64 = await Promise.all(imagePromises);

                const name = document.getElementById('prodName').value;
                const price = document.getElementById('prodPrice').value;
                const category = document.getElementById('prodCategory').value;
                const description = document.getElementById('prodDesc').value;

                const response = await fetch('https://festival-h6ff.onrender.com/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopSlug, name, price, category, description, images: imagesBase64 })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Success: Product photos ke saath live ho gaya!');
                    document.getElementById('addProductForm').reset();
                    loadMyProducts();
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                alert('Photos heavy hain ya network issue hai. Thodi kam size ki photos try karein.');
            } finally {
                submitBtn.innerText = "Save to Store 🚀";
                submitBtn.disabled = false;
            }
        });

        // 📦 LOAD ALL OWNER PRODUCTS
        let myProductsList = [];
        async function loadMyProducts() {
            const listEl = document.getElementById('myProductsList');
            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/products/${shopSlug}`);
                myProductsList = await res.json();

                if (myProductsList.length === 0) {
                    listEl.innerHTML = `<p class="text-gray-400 text-sm py-4">Abhi tak koi item list nahi kiya hai.</p>`;
                    return;
                }

                listEl.innerHTML = myProductsList.map(item => `
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${item.images[0] || 'https://via.placeholder.com/80'}" class="w-14 h-14 object-cover rounded-lg border">
                            <div class="truncate">
                                <h4 class="font-bold text-gray-900 text-sm truncate">${item.name}</h4>
                                <p class="text-xs text-orange-600 font-bold mt-0.5">₹${item.price} • <span class="text-gray-500 font-normal">${item.category}</span></p>
                                <p class="text-[10px] text-gray-400 font-medium">📷 ${item.images.length} Photos Attached</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openEditModal('${item._id}')" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-100">Edit</button>
                            <button onclick="deleteProduct('${item._id}')" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100">Delete</button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                listEl.innerHTML = `<p class="text-red-500 text-sm">Failed to load items.</p>`;
            }
        }

        // 🛠️ EDIT MODAL LOGIC
        function openEditModal(id) {
            const item = myProductsList.find(p => p._id === id);
            if (!item) return;

            document.getElementById('editProdId').value = item._id;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editDesc').value = item.description || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveProductEdit() {
            const id = document.getElementById('editProdId').value;
            const name = document.getElementById('editName').value;
            const price = document.getElementById('editPrice').value;
            const category = document.getElementById('editCategory').value;
            const description = document.getElementById('editDesc').value;

            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/products/edit/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, price, category, description })
                });

                if (res.ok) {
                    alert('Changes save ho gaye!');
                    closeEditModal();
                    loadMyProducts();
                } else {
                    alert('Update me problem aayi.');
                }
            } catch (err) {
                alert('Network error!');
            }
        }

        // 🗑️ DELETE PRODUCT
        async function deleteProduct(id) {
            if(!confirm("Kya aap sach me is item ko delete karna chahte hain?")) return;

            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/products/delete/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Item delete ho gaya!');
                    loadMyProducts();
                }
            } catch (err) {
                alert('Delete me problem aayi.');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'Index.html';
        }

        // Page load hone par items fetch karein
        loadMyProducts();
    </script>
</body>
</html>
