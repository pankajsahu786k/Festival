<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-2xl font-extrabold tracking-tight">Smart<span class="text-orange-500">Shop</span></h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="block px-4 py-3 bg-orange-600 rounded-xl font-semibold shadow-md">📊 Dashboard</a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full px-4 py-3 bg-gray-800 hover:bg-red-600 rounded-xl font-medium transition text-left flex items-center gap-2">🚪 Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-xl font-bold text-gray-800">Welcome to your Dashboard! 👋</h2>
            </header>

            <div class="p-8 space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Total Leads</p>
                        <h3 class="text-4xl font-black text-gray-900 mt-2">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-3">
                            <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Live Shop Link</p>
                            <a href="#" id="storeLinkBtn" target="_blank" class="text-xs bg-orange-100 text-orange-700 px-3 py-1.5 rounded font-bold hover:bg-orange-200 transition">Open Link 🔗</a>
                        </div>
                        <p id="fullStoreLink" class="text-xs font-medium text-gray-800 bg-gray-50 p-2.5 rounded-lg border border-gray-200 break-all">Loading...</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Store Status</p>
                        <h3 class="text-2xl font-bold text-green-600 mt-3 flex items-center gap-2">Active & Ready</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-4">➕ Add New Item / Property</h3>
                        
                        <form id="addProductForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Title</label>
                                <input type="text" id="prodName" placeholder="E.g. 2 BHK Flat MP Nagar" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Price (₹)</label>
                                    <input type="number" id="prodPrice" placeholder="15000" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Category</label>
                                    <input type="text" id="prodCategory" placeholder="Rent / Sell" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Gallery Photos <span class="text-orange-600">(1 to 5 Photos)</span></label>
                                <input type="file" id="prodGallery" multiple accept="image/*" required class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl bg-gray-50 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Description</label>
                                <textarea id="prodDesc" rows="2" placeholder="Facilities, Location, Rules..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-orange-600 text-white font-bold text-sm py-3 rounded-xl hover:bg-orange-700 transition shadow-md">Save to Live Store 🚀</button>
                        </form>
                    </div>

                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">📦 Manage Active Listings</h3>
                            <button onclick="loadMyProducts()" class="text-xs text-orange-600 font-bold hover:underline">🔄 Refresh List</button>
                        </div>
                        <div id="myProductsList" class="grid grid-cols-1 gap-4">
                            <p class="text-gray-400 text-sm">Loading listings...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const shopSlug = localStorage.getItem('shopSlug');
        const shopUrl = `https://festival-h6ff.onrender.com/shop.html?store=${shopSlug}`;

        if(shopSlug) {
            document.getElementById('fullStoreLink').innerText = shopUrl;
            document.getElementById('storeLinkBtn').href = shopUrl;
        }

        // 🚀 DIRECT FILE UPLOAD (NO BASE64 CORRUPTION)
        const IMGBB_API_KEY = "c5890563d7bc34314bc8868dff6de3ca"; 
        
        const uploadToCloud = async (file) => {
            const formData = new FormData();
            formData.append('image', file); // Seedha file bheja

            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if(data.success) {
                return data.data.url; // Asli link return karega
            } else {
                throw new Error("ImgBB Upload Failed");
            }
        };

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('prodGallery');
            const files = Array.from(fileInput.files);

            if (files.length > 5) {
                alert("⚠️ Maximum 5 photos allow hain!");
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerText = "Uploading to Cloud... ⏳";
            submitBtn.disabled = true;

            try {
                // Upload direct files
                const imagePromises = files.map(file => uploadToCloud(file));
                const cloudUrls = await Promise.all(imagePromises); 

                const name = document.getElementById('prodName').value;
                const price = document.getElementById('prodPrice').value;
                const category = document.getElementById('prodCategory').value;
                const description = document.getElementById('prodDesc').value;

                const response = await fetch('https://festival-h6ff.onrender.com/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopSlug, name, price, category, description, images: cloudUrls })
                });

                if (response.ok) {
                    alert('Success: Item Cloud photos ke sath live ho gaya hai!');
                    document.getElementById('addProductForm').reset();
                    loadMyProducts(); 
                } else {
                    const data = await response.json();
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                console.error(error);
                alert('Upload fail ho gaya. Kripya apna Internet connection check karein.');
            } finally {
                submitBtn.innerText = "Save to Live Store 🚀";
                submitBtn.disabled = false;
            }
        });

        async function loadMyProducts() {
            const listEl = document.getElementById('myProductsList');
            listEl.innerHTML = `<p class="text-gray-400 text-sm">Fetching...</p>`;
            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/products/${shopSlug}`);
                const myProductsList = await res.json();

                if (myProductsList.length === 0) {
                    listEl.innerHTML = `<p class="text-gray-400 text-sm">Abhi tak koi item list nahi ki hai.</p>`;
                    return;
                }

                listEl.innerHTML = myProductsList.map(item => `
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 flex flex-col justify-between gap-3 transition hover:shadow-md">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${item.images && item.images.length > 0 ? item.images[0] : 'https://via.placeholder.com/80?text=No+Image'}" onerror="this.src='https://via.placeholder.com/80?text=Error'" class="w-16 h-16 object-cover rounded-lg border border-gray-200 flex-shrink-0">
                            <div class="truncate">
                                <h4 class="font-bold text-gray-900 text-sm truncate">${item.name}</h4>
                                <p class="text-xs text-orange-600 font-bold mt-0.5">₹${item.price} • <span class="text-gray-500 font-normal">${item.category}</span></p>
                            </div>
                        </div>
                        <div class="flex gap-2 mt-2 border-t border-gray-100 pt-3">
                            <button onclick="deleteProduct('${item._id}')" class="flex-1 bg-red-50 text-red-600 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-red-500 text-sm">Failed to load items.</p>`;
            }
        }

        async function deleteProduct(id) {
            if(!confirm("Kya aap sach me is listing ko delete karna chahte hain?")) return;
            try {
                const res = await fetch(`https://festival-h6ff.onrender.com/api/products/delete/${id}`, { method: 'DELETE' });
                if (res.ok) loadMyProducts(); 
            } catch (err) { alert('Delete error.'); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'Index.html';
        }

        loadMyProducts();
    </script>
</body>
</html>
