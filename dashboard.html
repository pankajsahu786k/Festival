<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-gray-900 text-white flex flex-col hidden md:flex">
            <div class="p-6 border-b border-gray-800">
                <h1 class="text-2xl font-extrabold tracking-tight">Smart<span class="text-orange-500">Shop</span></h1>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#" class="block px-4 py-3 bg-orange-600 rounded-xl font-semibold shadow-md">📊 Dashboard</a>
                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-xl font-medium transition flex justify-between items-center">
                    <span>📦 Orders</span>
                    <span class="bg-orange-500 text-[10px] px-2 py-0.5 rounded-full font-bold">NEW</span>
                </a>
                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-xl font-medium transition">⚙️ Settings</a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full px-4 py-3 bg-gray-800 hover:bg-red-600 rounded-xl font-medium transition text-left flex items-center gap-2">
                    🚪 Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-xl font-bold text-gray-800">Vendor Control Panel 👋</h2>
                <div class="flex items-center gap-4">
                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Live
                    </span>
                    <div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center text-orange-600 font-bold border border-orange-200">
                        S
                    </div>
                </div>
            </header>

            <div class="p-8 space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Shop ID</p>
                        <h3 id="slugDisplay" class="text-2xl font-black text-orange-600 mt-2">Loading...</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Public Link</p>
                        <a href="#" id="storeLink" target="_blank" class="text-xs text-blue-600 font-bold hover:underline block truncate mt-3">Generating...</a>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Status</p>
                        <h3 class="text-2xl font-bold text-green-600 mt-2 flex items-center gap-2">Active</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-2">➕ Add New Item / Property</h3>
                        
                        <form id="addProductForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Title / Name</label>
                                <input type="text" id="prodName" placeholder="E.g. 2 BHK Flat MP Nagar / Pearl Rakhi" required
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Price (₹)</label>
                                    <input type="number" id="prodPrice" placeholder="E.g. 25000" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Category</label>
                                    <input type="text" id="prodCategory" placeholder="E.g. Rental / Sweets" required
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Image URL</label>
                                <input type="url" id="prodImage" placeholder="https://images.unsplash.com/..."
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium">
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Description</label>
                                <textarea id="prodDesc" rows="3" placeholder="Full details, address, features..."
                                    class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white outline-none text-sm font-medium"></textarea>
                            </div>

                            <button type="submit" 
                                class="w-full bg-orange-600 text-white font-bold text-sm py-3.5 rounded-xl hover:bg-orange-700 transition shadow-md">
                                Save Item to Store 🚀
                            </button>
                        </form>
                    </div>

                    <div class="bg-gradient-to-br from-orange-500 to-red-500 rounded-2xl shadow-lg p-8 text-white relative overflow-hidden flex flex-col justify-center items-center text-center">
                        <div class="relative z-10 w-full" id="qrCodeContainer">
                            <h3 class="text-2xl font-extrabold mb-2">Get Your Store QR</h3>
                            <p class="text-orange-100 text-sm mb-6 leading-relaxed">
                                Grahak scan karke aapke saare listings live dekh sakte hain.
                            </p>
                            <button onclick="generateQR()" 
                                class="bg-white text-orange-600 font-extrabold px-6 py-3 rounded-xl shadow-md hover:scale-105 active:scale-95 transition-all w-full md:w-auto">
                                Generate QR Code 🪄
                            </button>
                        </div>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const shopSlug = localStorage.getItem('shopSlug');
        const shopUrl = `https://festival-h6ff.onrender.com/shop.html?store=${shopSlug}`;

        if(shopSlug) {
            document.getElementById('slugDisplay').innerText = shopSlug;
            const storeLinkEl = document.getElementById('storeLink');
            storeLinkEl.innerText = shopUrl;
            storeLinkEl.href = shopUrl;
        }

        // ADD PRODUCT FORM SUBMIT LOGIC
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerText = "Saving... ⏳";
            submitBtn.disabled = true;

            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const image = document.getElementById('prodImage').value;
            const description = document.getElementById('prodDesc').value;

            try {
                const response = await fetch('https://festival-h6ff.onrender.com/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopSlug, name, price, category, image, description })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Success: Item store me add ho gaya hai!');
                    document.getElementById('addProductForm').reset();
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                alert('Network Error!');
            } finally {
                submitBtn.innerText = "Save Item to Store 🚀";
                submitBtn.disabled = false;
            }
        });

        function generateQR() {
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(shopUrl)}`;
            document.getElementById('qrCodeContainer').innerHTML = `
                <h3 class="text-xl font-extrabold mb-4">Store QR Code</h3>
                <div class="bg-white p-3 rounded-2xl shadow-2xl inline-block">
                    <img src="${qrApiUrl}" class="w-48 h-48 md:w-56 md:h-56">
                </div>
                <a href="${qrApiUrl}" target="_blank" class="mt-4 inline-block bg-white text-orange-600 text-sm font-bold px-5 py-2.5 rounded-lg shadow-sm">View Full Size</a>
            `;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'Index.html';
        }
    </script>

</body>
</html>
