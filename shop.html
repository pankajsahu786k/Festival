<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 90px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Smooth Slide Animation for Product Details */
        #productModal { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 relative">

    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="px-4 py-4 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-extrabold text-orange-500 uppercase tracking-widest">Welcome to</p>
                <h1 id="storeName" class="text-xl font-extrabold text-gray-900 truncate max-w-[200px]">Loading Store...</h1>
            </div>
            <div class="bg-gray-50 p-2.5 rounded-full border border-gray-100 shadow-sm">
                🏪
            </div>
        </div>
        
        <div class="px-4 pb-4">
            <div class="bg-gray-100 rounded-xl px-4 py-2.5 flex items-center gap-2">
                <span class="text-gray-400">🔍</span>
                <input type="text" placeholder="Search for products..." class="bg-transparent outline-none w-full text-sm font-medium">
            </div>
        </div>
    </header>

    <div class="px-4 py-3 flex gap-3 overflow-x-auto no-scrollbar bg-white border-b border-gray-200">
        <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-md">All Items</button>
        <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap border border-gray-200 hover:bg-gray-50">Festival</button>
        <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap border border-gray-200 hover:bg-gray-50">Sweets</button>
    </div>

    <main class="p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="productList">
        </main>

    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] transform translate-y-full transition-transform duration-300 flex justify-between items-center z-40">
        <div class="flex flex-col">
            <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Amount</span>
            <span class="text-xl font-black text-gray-900" id="cartTotal">₹0</span>
        </div>
        <button onclick="checkoutToWhatsApp()" class="bg-orange-600 text-white px-6 py-3.5 rounded-xl font-bold shadow-lg hover:bg-orange-700 active:scale-95 transition-all flex items-center gap-2">
            <span>Proceed to Order</span> 📲
        </button>
    </div>

    <div id="productModal" class="fixed inset-0 bg-white z-50 transform translate-x-full overflow-y-auto flex flex-col">
        
        <div class="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-4 flex justify-between items-center z-10 border-b border-gray-100">
            <button onclick="closeProductModal()" class="bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-sm active:scale-90 transition">
                ←
            </button>
            <span class="font-bold text-gray-900">Product Details</span>
            <div class="w-10"></div> </div>

        <div id="modalContent" class="flex-1 pb-24"></div>

        <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] flex gap-4">
            <div class="flex-1">
                <p class="text-xs text-gray-500 font-bold uppercase">Price</p>
                <p id="modalPrice" class="text-2xl font-black text-gray-900">₹0</p>
            </div>
            <button id="modalAddToCartBtn" class="flex-[2] bg-gray-900 text-white rounded-xl font-bold text-sm hover:bg-black active:scale-95 transition shadow-lg flex items-center justify-center">
                Add to Cart 🛒
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');
        let dynamicVendorPhone = ""; 
        let realShopName = "";

        async function fetchShopDetails() {
            if(!storeId) {
                document.getElementById('storeName').innerText = "Store ID Missing";
                return;
            }
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/shop/${storeId}`);
                const data = await response.json();
                if(response.ok) {
                    realShopName = data.shopName;
                    document.getElementById('storeName').innerText = realShopName;
                    dynamicVendorPhone = "91" + data.mobileNumber; 
                } else {
                    document.getElementById('storeName').innerText = "Shop Not Found";
                }
            } catch (error) {
                console.error("Error fetching shop details:", error);
            }
        }

        // 🚀 DUMMY PRODUCTS WITH EXTRA DETAILS & MULTIPLE IMAGES
        const products = [
            { 
                id: 1, 
                name: "Premium Pearl Rakhi Set", 
                price: 150, 
                images: [
                    "https://images.unsplash.com/photo-1628543105304-4bedee16b473?w=500&h=500&fit=crop",
                    "https://images.unsplash.com/photo-1595853035070-59a39fe84de3?w=500&h=500&fit=crop"
                ],
                description: "Celebrate the bond of love with this beautifully handcrafted Premium Pearl Rakhi. Made with authentic beads, skin-friendly thread, and comes with complimentary Roli-Chawal.",
                rating: 4.8,
                reviews: 124
            },
            { 
                id: 2, 
                name: "Pure Kaju Katli (500g)", 
                price: 450, 
                images: [
                    "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500&h=500&fit=crop",
                    "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500&h=500&fit=crop"
                ],
                description: "100% pure premium cashew nuts blended with right amount of sweetness and wrapped in edible silver foil. A classic Indian sweet perfect for every festival.",
                rating: 4.9,
                reviews: 350
            },
            { 
                id: 3, 
                name: "Festival Pooja Thali", 
                price: 299, 
                images: [
                    "https://images.unsplash.com/photo-1605371844229-23c21a4f0db5?w=500&h=500&fit=crop"
                ],
                description: "A beautifully decorated brass Pooja Thali containing diya, incense holder, and small bowls for kumkum. Gives your festival preparation a traditional touch.",
                rating: 4.5,
                reviews: 89
            }
        ];

        let cart = {}; 

        // RENDER GRID LIST
        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            products.forEach(product => {
                const qty = cart[product.id] || 0;
                
                // Card UI 
                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative group cursor-pointer" onclick="openProductModal(${product.id})">
                        
                        <div class="relative aspect-square overflow-hidden bg-gray-50">
                            <img src="${product.images[0]}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                            ${qty > 0 ? `<div class="absolute top-2 right-2 bg-orange-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shadow-md">${qty}</div>` : ''}
                        </div>
                        
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${product.name}</h3>
                                <div class="flex items-center gap-1 mt-1">
                                    <span class="text-yellow-400 text-xs">★</span>
                                    <span class="text-xs text-gray-500 font-semibold">${product.rating}</span>
                                </div>
                            </div>
                            <p class="text-gray-900 font-black text-lg mt-2">₹${product.price}</p>
                        </div>
                    </div>
                `;
            });
            updateCartUI();
        }

        // ==============================================
        // 🚀 MODAL LOGIC (Detail View)
        // ==============================================
        let activeProductId = null;

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;
            
            activeProductId = id;

            // Generate Image Gallery HTML
            let imagesHtml = '';
            product.images.forEach(img => {
                imagesHtml += `<img src="${img}" class="w-full h-auto aspect-square object-cover flex-shrink-0 snap-center">`;
            });

            // Set Content
            document.getElementById('modalContent').innerHTML = `
                <div class="w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar bg-gray-50">
                    ${imagesHtml}
                </div>
                
                <div class="p-5">
                    <div class="flex justify-between items-start gap-4 mb-2">
                        <h2 class="text-2xl font-extrabold text-gray-900 leading-tight">${product.name}</h2>
                    </div>
                    
                    <div class="flex items-center gap-2 mb-6">
                        <div class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold flex items-center gap-1">
                            ${product.rating} ★
                        </div>
                        <span class="text-xs font-medium text-gray-500">${product.reviews} ratings</span>
                    </div>

                    <div class="border-t border-gray-100 pt-5">
                        <h3 class="font-bold text-gray-900 mb-2">Product Description</h3>
                        <p class="text-gray-600 text-sm leading-relaxed">${product.description}</p>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-5 mt-5">
                        <div class="bg-orange-50 rounded-xl p-4 flex items-center gap-3 border border-orange-100">
                            <span class="text-xl">🚚</span>
                            <div>
                                <p class="text-sm font-bold text-gray-900">Instant Delivery available</p>
                                <p class="text-xs text-gray-600">Pick up from counter right away.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalPrice').innerText = `₹${product.price}`;
            
            // Update Add to Cart Button Logic
            const btn = document.getElementById('modalAddToCartBtn');
            btn.onclick = () => {
                updateCart(product.id, 1);
                closeProductModal(); // Cart me add karke modal band kar dena (Optional)
            };

            // Slide In Modal
            const modal = document.getElementById('productModal');
            modal.classList.remove('translate-x-full');
        }

        function closeProductModal() {
            const modal = document.getElementById('productModal');
            modal.classList.add('translate-x-full');
            activeProductId = null;
        }

        // ==============================================
        // CART & CHECKOUT LOGIC
        // ==============================================
        function updateCart(productId, change) {
            if(!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if(cart[productId] <= 0) delete cart[productId];
            renderProducts(); 
        }

        function updateCartUI() {
            let total = 0;
            let itemCount = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    total += (product.price * qty);
                    itemCount += qty;
                }
            }
            document.getElementById('cartTotal').innerText = `₹${total}`;
            const cartBar = document.getElementById('cartBar');
            if(itemCount > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        function checkoutToWhatsApp() {
            if(!dynamicVendorPhone) {
                alert("Shop details loading... Please wait a second.");
                return;
            }

            let message = `*New Order Details* 🛍️\nStore: ${realShopName}\n\n`;
            let total = 0;

            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    let itemTotal = product.price * qty;
                    message += `▪️ ${product.name} (x${qty}) - ₹${itemTotal}\n`;
                    total += itemTotal;
                }
            }

            message += `\n*Total Bill: ₹${total}*\n\nPlease process this order.`;
            const whatsappUrl = `https://wa.me/${dynamicVendorPhone}?text=${encodeURIComponent(message)}`;
            window.location.href = whatsappUrl;
        }

        fetchShopDetails();
        renderProducts();
    </script>
</body>
</html>
