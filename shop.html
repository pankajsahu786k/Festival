<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e5e7eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Smooth scrolling for photo slider */
        .slider-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">

        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="px-4 py-4 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-extrabold text-orange-500 uppercase tracking-widest">Welcome to</p>
                    <h1 id="storeName" class="text-xl font-extrabold text-gray-900 truncate max-w-[200px]">Loading Store...</h1>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-full border border-gray-100 shadow-sm">🏪</div>
            </div>
        </header>

        <main class="p-4 grid grid-cols-2 gap-4" id="productList">
            <div class="col-span-2 text-center py-10 text-gray-400 font-medium">Loading items...</div>
        </main>

        <div id="cartBar" 
             class="fixed bottom-0 left-1/2 w-full max-w-md bg-white border-t border-gray-200 p-4 shadow-2xl transition-all duration-300 flex justify-between items-center z-40"
             style="transform: translateX(-50%) translateY(100%);">
            <div class="flex flex-col">
                <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Amount</span>
                <span class="text-xl font-black text-gray-900" id="cartTotal">₹0</span>
            </div>
            <button onclick="checkoutToWhatsApp()" class="bg-orange-600 text-white px-6 py-3.5 rounded-xl font-bold shadow-lg hover:bg-orange-700 flex items-center gap-2">
                <span>Order on WhatsApp</span> 📲
            </button>
        </div>

        <div id="productModal" 
             class="fixed inset-y-0 left-1/2 w-full max-w-md bg-white z-50 flex flex-col transition-all duration-300"
             style="transform: translateX(-50%) translateY(100%);">
            
            <div class="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-4 flex justify-between items-center z-10 border-b border-gray-100">
                <button onclick="closeProductModal()" class="bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-sm">←</button>
                <span class="font-bold text-gray-900">Property / Item Details</span>
                <div class="w-10"></div> 
            </div>

            <div id="modalContent" class="flex-1 overflow-y-auto pb-24"></div>

            <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4 shadow-lg flex items-center justify-between gap-4">
                <div class="flex flex-col">
                    <p class="text-xs text-gray-500 font-bold uppercase">Price</p>
                    <p id="modalPrice" class="text-2xl font-black text-gray-900">₹0</p>
                </div>
                
                <div id="modalActionContainer" class="flex items-center">
                    </div>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');
        let dynamicVendorPhone = ""; 
        let realShopName = "";
        let products = [];
        let autoSlideInterval = null; 
        const fallbackImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500&q=80";

        async function fetchShopDetails() {
            if(!storeId) return;
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/shop/${storeId}`);
                const data = await response.json();
                if(response.ok) {
                    realShopName = data.shopName;
                    document.getElementById('storeName').innerText = realShopName;
                    dynamicVendorPhone = "91" + data.mobileNumber; 
                }
            } catch (error) { console.error(error); }
        }

        async function fetchProducts() {
            if(!storeId) return;
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/products/${storeId}`);
                const data = await response.json();
                
                if(response.ok && data.length > 0) {
                    products = data.map(p => ({
                        id: p._id,
                        name: p.name,
                        price: p.price,
                        images: (p.images && p.images.length > 0) ? p.images : [fallbackImg],
                        description: p.description || "No description provided.",
                        category: p.category || "General"
                    }));
                } else {
                    products = [];
                }
                renderProducts();
            } catch (error) { console.error(error); }
        }

        let cart = {}; 

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            if(products.length === 0) {
                list.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 font-medium">Koi item list nahi hua hai.</div>`;
                return;
            }

            products.forEach(product => {
                const qty = cart[product.id] || 0;
                const firstImg = product.images[0] || fallbackImg;

                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative cursor-pointer" onclick="openProductModal('${product.id}')">
                        <div class="relative aspect-square overflow-hidden bg-gray-50">
                            <img src="${firstImg}" onerror="this.src='${fallbackImg}'" class="w-full h-full object-cover">
                            
                            ${qty > 0 ? `<div class="absolute top-2 right-2 bg-orange-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shadow-md z-10">${qty}</div>` : ''}

                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white px-2 py-0.5 rounded-md text-[10px] font-bold">
                                📷 ${product.images.length} Photos
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${product.name}</h3>
                                <span class="text-[10px] bg-orange-50 text-orange-600 font-bold px-2 py-0.5 rounded mt-1 inline-block">${product.category}</span>
                            </div>
                            <p class="text-gray-900 font-black text-lg mt-2">₹${product.price}</p>
                        </div>
                    </div>
                `;
            });
            updateCartUI();
        }

        // 🚀 AUTOMATIC PHOTO SLIDER FUNCTION
        function startAutoSlider(totalImages) {
            stopAutoSlider(); 
            if (totalImages <= 1) return;

            const slider = document.getElementById('modalImageSlider');
            let currentIndex = 0;

            autoSlideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalImages;
                if(slider) {
                    slider.scrollLeft = currentIndex * slider.clientWidth;
                    updateSliderDots(currentIndex);
                }
            }, 3000); // 3 seconds me automatic slide hoga
        }

        function stopAutoSlider() {
            if (autoSlideInterval) {
                clearInterval(autoSlideInterval);
                autoSlideInterval = null;
            }
        }

        function updateSliderDots(index) {
            const dots = document.querySelectorAll('.slider-dot');
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.remove('bg-gray-300', 'w-2');
                    dot.classList.add('bg-orange-600', 'w-4');
                } else {
                    dot.classList.remove('bg-orange-600', 'w-4');
                    dot.classList.add('bg-gray-300', 'w-2');
                }
            });
        }

        // Open Modal Details
        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;

            let imagesHtml = product.images.map(img => `
                <img src="${img}" onerror="this.src='${fallbackImg}'" class="w-full h-72 object-cover flex-shrink-0 snap-center">
            `).join('');

            // Generate Slide indicators/dots
            let dotsHtml = product.images.map((_, i) => `
                <span class="slider-dot h-2 rounded-full transition-all duration-300 ${i === 0 ? 'bg-orange-600 w-4' : 'bg-gray-300 w-2'}"></span>
            `).join('');

            document.getElementById('modalContent').innerHTML = `
                <div class="relative">
                    <div id="modalImageSlider" class="slider-container w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar bg-black">
                        ${imagesHtml}
                    </div>
                    
                    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-1.5 bg-white/60 backdrop-blur-md px-2.5 py-1.5 rounded-full shadow-sm">
                        ${dotsHtml}
                    </div>
                </div>

                <div class="p-5">
                    <h2 class="text-2xl font-extrabold text-gray-900 leading-tight mb-2">${product.name}</h2>
                    <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${product.category}</span>
                    
                    <div class="border-t border-gray-100 pt-4 mt-4">
                        <h3 class="font-bold text-gray-900 mb-2">Description / Full Details</h3>
                        <p class="text-gray-600 text-sm leading-relaxed whitespace-pre-line">${product.description}</p>
                    </div>
                </div>
            `;

            document.getElementById('modalPrice').innerText = `₹${product.price}`;
            
            // Render Quantity Controls Inside Footer
            updateModalFooterControls(product.id);

            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(0)';

            // Start Auto sliding
            startAutoSlider(product.images.length);

            // Manual scroll check to update dots manually if user swipes
            const sliderEl = document.getElementById('modalImageSlider');
            sliderEl.addEventListener('scroll', () => {
                const index = Math.round(sliderEl.scrollLeft / sliderEl.clientWidth);
                updateSliderDots(index);
            });
        }

        // 🛠️ DYNAMIC PLUS/MINUS QUANTITY CONTROLLER LOGIC FOR MODAL
        function updateModalFooterControls(productId) {
            const container = document.getElementById('modalActionContainer');
            const qty = cart[productId] || 0;

            if(qty === 0) {
                container.innerHTML = `
                    <button onclick="changeQuantityFromModal('${productId}', 1)" class="bg-gray-900 text-white rounded-xl font-bold text-sm px-8 py-3.5 hover:bg-black active:scale-95 transition shadow-lg">
                        Add to Cart 🛒
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center bg-gray-100 rounded-xl p-1 border border-gray-200 shadow-inner">
                        <button onclick="changeQuantityFromModal('${productId}', -1)" class="bg-white text-gray-900 w-10 h-10 rounded-lg font-black text-lg flex items-center justify-center hover:bg-gray-50 active:scale-90 transition shadow-sm">-</button>
                        <span class="px-5 font-extrabold text-gray-900 text-base min-w-[40px] text-center">${qty}</span>
                        <button onclick="changeQuantityFromModal('${productId}', 1)" class="bg-white text-gray-900 w-10 h-10 rounded-lg font-black text-lg flex items-center justify-center hover:bg-gray-50 active:scale-90 transition shadow-sm">+</button>
                    </div>
                `;
            }
        }

        function changeQuantityFromModal(productId, change) {
            if(!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if(cart[productId] <= 0) delete cart[productId];
            
            // Instant updates
            renderProducts(); 
            updateModalFooterControls(productId);
        }

        function closeProductModal() {
            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(100%)';
            stopAutoSlider(); 
        }

        function updateCartUI() {
            let total = 0;
            let itemCount = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    total += (product.price * qty);
                    itemCount += qty;
                }
            }
            document.getElementById('cartTotal').innerText = `₹${total}`;
            const cartBar = document.getElementById('cartBar');
            if(itemCount > 0) {
                cartBar.style.transform = 'translateX(-50%) translateY(0)';
            } else {
                cartBar.style.transform = 'translateX(-50%) translateY(100%)';
            }
        }

        function checkoutToWhatsApp() {
            if(!dynamicVendorPhone) return;
            let message = `*New Booking / Inquiry* 🛍️\nStore: ${realShopName}\n\n`;
            let total = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    let itemTotal = product.price * qty;
                    message += `▪️ ${product.name} (x${qty}) - ₹${itemTotal}\n`;
                    total += itemTotal;
                }
            }
            message += `\n*Total Amount: ₹${total}*\n\nPlease provide more details.`;
            const whatsappUrl = `https://wa.me/${dynamicVendorPhone}?text=${encodeURIComponent(message)}`;
            window.location.href = whatsappUrl;
        }

        fetchShopDetails();
        fetchProducts();
    </script>
</body>
</html>
