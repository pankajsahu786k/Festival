<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e5e7eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .slider-container { scroll-behavior: smooth; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">

        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="px-4 py-4 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-extrabold text-orange-500 uppercase tracking-widest">Welcome to</p>
                    <h1 id="storeName" class="text-xl font-extrabold text-gray-900 truncate max-w-[200px]">Loading Store...</h1>
                    <div id="shopDistanceBadge" class="mt-1 hidden">
                        <span class="text-[11px] font-black text-blue-700 bg-blue-50 border border-blue-100 px-2 py-0.5 rounded-md">
                            📍 Loading distance...
                        </span>
                    </div>
                </div>
                <a id="callBtn" href="#" class="bg-orange-100 text-orange-600 px-4 py-2 rounded-full hover:bg-orange-200 transition shadow-sm font-bold text-sm flex items-center gap-1 hidden">📞 Call</a>
            </div>
        </header>
        <div class="m-4 p-4 border border-gray-100 rounded-xl bg-white hidden shadow-sm" id="mapSection">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-extrabold text-gray-900">Store Location 📍</h3>
                <a id="getDirectionsBtn" href="#" target="_blank" class="text-[11px] font-bold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition shadow-sm border border-blue-100 flex items-center gap-1">
                    Get Directions ↗
                </a>
            </div>
            <div class="w-full h-36 rounded-xl overflow-hidden border border-gray-200 shadow-inner relative bg-gray-50">
                <iframe id="shopMapIframe" width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src=""></iframe>
            </div>
            <p id="shopAddressFull" class="text-xs text-gray-500 font-medium mt-2 leading-relaxed flex gap-1">
                <span class="text-gray-400">🏠</span> <span id="addressText">Address yahan aayega...</span>
            </p>
        </div>
        <main class="p-4 grid grid-cols-2 gap-4" id="productList">
            <div class="col-span-2 text-center py-10 text-gray-400 font-medium">Loading items...</div>
        </main>

        <div id="cartBar" class="fixed bottom-0 left-1/2 w-full max-w-md bg-white border-t border-gray-200 p-4 shadow-2xl transition-all duration-300 flex justify-between items-center z-40" style="transform: translateX(-50%) translateY(100%);">
            <div class="flex flex-col">
                <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Amount</span>
                <span class="text-xl font-black text-gray-900" id="cartTotal">₹0</span>
            </div>
            <button onclick="openCheckoutModal()" class="bg-orange-600 text-white px-6 py-3.5 rounded-xl font-bold shadow-lg hover:bg-orange-700 active:scale-95 transition flex items-center gap-2">
                <span>Order Now</span> 📲
            </button>
        </div>

        <div id="productModal" class="fixed inset-y-0 left-1/2 w-full max-w-md bg-white z-50 flex flex-col transition-all duration-300 shadow-2xl" style="transform: translateX(-50%) translateY(100%);">
            <div class="sticky top-0 bg-white/90 backdrop-blur-md px-4 py-4 flex justify-between items-center z-10 border-b border-gray-100">
                <button onclick="closeProductModal()" class="bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center font-black shadow-sm text-gray-700 hover:bg-gray-200">←</button>
                <span class="font-bold text-gray-900">View Full Item Photos</span>
                <div class="w-10"></div> 
            </div>
            
            <div id="modalContent" class="flex-1 overflow-y-auto pb-24 no-scrollbar"></div>
            
            <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4 shadow-lg flex items-center justify-between gap-4">
                <div class="flex flex-col">
                    <p class="text-xs text-gray-500 font-bold uppercase">Total Price</p>
                    <p id="modalPrice" class="text-2xl font-black text-gray-900">₹0</p>
                </div>
                <div id="modalActionContainer" class="flex items-center"></div>
            </div>
        </div>

        <div id="checkoutModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
            <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-gray-900">Confirm Details</h3>
                    <button onclick="closeCheckoutModal()" class="text-gray-400 font-black hover:text-gray-900">X</button>
                </div>
                <p class="text-xs text-gray-500 leading-relaxed">Kripya apna naam daalein taaki owner ko pata chal sake ki order kisne kiya hai.</p>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-600 mb-1">Customer Name</label>
                    <input type="text" id="custName" placeholder="Enter your full name" required class="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 outline-none focus:bg-white focus:border-orange-500 text-sm font-medium">
                </div>
                <button onclick="submitOrder()" id="finalOrderBtn" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl text-sm hover:bg-green-700 shadow-md transition flex justify-center items-center gap-2">
                    Send via WhatsApp 🚀
                </button>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');
        let dynamicVendorPhone = ""; 
        let realShopName = "";
        let products = [];
        let autoSlideInterval = null; 
        let shopCoordinates = null; // To store shop's GPS coordinates
        const fallbackImg = "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500&q=80";

        // 📍 Client side distance computation logic (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        // Request Grahak GPS to calculate distance dynamically
        function detectCustomerDistance() {
            if (navigator.geolocation && shopCoordinates && shopCoordinates.lat) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const custLat = position.coords.latitude;
                    const custLng = position.coords.longitude;
                    
                    const distance = calculateDistance(custLat, custLng, shopCoordinates.lat, shopCoordinates.lng);
                    
                    const badge = document.getElementById('shopDistanceBadge');
                    badge.innerHTML = `<span class="text-[11px] font-black text-blue-700 bg-blue-50 border border-blue-100 px-2.5 py-0.5 rounded-md">📍 ${distance.toFixed(1)} KM away from you</span>`;
                    badge.classList.remove('hidden');
                }, () => {
                    console.log("Location access denied by user.");
                });
            }
        }

        async function fetchShopDetails() {
            if(!storeId) return;
            try {
                const response = await fetch(`/api/shop/${storeId}`);
                const data = await response.json();
                if(response.ok) {
                    realShopName = data.shopName;
                    document.getElementById('storeName').innerText = realShopName;
                    dynamicVendorPhone = "91" + data.mobileNumber; 
                    
                    // 📞 CALL BUTTON ENGINE
                    const callBtn = document.getElementById('callBtn');
                    if (callBtn) {
                        if (data.mobileNumber) {
                            callBtn.href = `tel:${data.mobileNumber}`;
                            callBtn.classList.remove('hidden'); // Button dikhao
                        } else {
                            callBtn.classList.add('hidden'); 
                        }
                    }

                    // 🗺️ SMART MAP ENGINE (Exact GPS tracking)
                    let mapQuery = "";
                    
                    if (data.location && data.location.lat && data.location.lng) {
                        shopCoordinates = data.location;
                        detectCustomerDistance(); // Trigger live tracking engine
                        mapQuery = `${data.location.lat},${data.location.lng}`;
                    } else if (data.address) {
                        mapQuery = encodeURIComponent(data.address);
                    } else {
                        mapQuery = encodeURIComponent(data.shopName + " Bhopal"); 
                    }

                    // 1. Google Map Embed iframe (💯 PERFECT URL WITH $)
                    const finalMapUrl = `https://maps.google.com/maps?q=${mapQuery}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('shopMapIframe').src = finalMapUrl;
                    
                    // 2. Direct Phone Navigation Link (💯 PERFECT URL WITH $)
                    const finalDirUrl = `https://maps.google.com/maps?q=${mapQuery}`;
                    document.getElementById('getDirectionsBtn').href = finalDirUrl;
                    
                    // 3. Address dikhana
                    if (data.address) {
                        document.getElementById('addressText').innerText = data.address;
                    } else {
                        document.getElementById('shopAddressFull').classList.add('hidden');
                    }
                    
                    // Map section ko visible kardo
                    document.getElementById('mapSection').classList.remove('hidden');
                }
            } catch (error) { console.error(error); }
        }

        async function fetchProducts() {
            if(!storeId) return;
            try {
                const response = await fetch(`/api/products/${storeId}`);
                const data = await response.json();
                
                if(response.ok && data.length > 0) {
                    products = data.map(p => ({
                        id: p._id,
                        name: p.name,
                        price: p.price,
                        stockQuantity: p.stockQuantity || 0, 
                        images: (p.images && p.images.length > 0) ? p.images : [fallbackImg],
                        description: p.description || "No description provided.",
                        category: p.category || "General"
                    }));
                } else {
                    products = [];
                }
                renderProducts();
            } catch (error) { console.error(error); }
        }

        let cart = {}; 

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            if(products.length === 0) {
                list.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 font-medium">Koi item list nahi hua hai.</div>`;
                return;
            }

            products.forEach(product => {
                const qty = cart[product.id] || 0;
                const firstImg = product.images[0] || fallbackImg;
                const isOutOfStock = product.stockQuantity <= 0;

                let actionBtnHtml = '';
                if(!isOutOfStock) {
                    if(qty === 0) {
                        actionBtnHtml = `
                            <button onclick="event.stopPropagation(); changeQuantityDirect('${product.id}', 1)" class="bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-orange-700 active:scale-95 transition shadow-sm">
                                + Add
                            </button>
                        `;
                    } else {
                        actionBtnHtml = `
                            <div class="flex items-center bg-gray-100 rounded-lg p-0.5 border border-gray-200">
                                <button onclick="event.stopPropagation(); changeQuantityDirect('${product.id}', -1)" class="bg-white text-gray-900 w-6 h-6 rounded font-black text-xs flex items-center justify-center shadow-sm active:scale-90">-</button>
                                <span class="px-2 font-bold text-xs text-gray-900">${qty}</span>
                                <button onclick="event.stopPropagation(); changeQuantityDirect('${product.id}', 1)" class="bg-white text-gray-900 w-6 h-6 rounded font-black text-xs flex items-center justify-center shadow-sm active:scale-90">+</button>
                            </div>
                        `;
                    }
                }

                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative ${isOutOfStock ? 'opacity-60 cursor-not-allowed' : ''}">
                        <div onclick="${isOutOfStock ? '' : `openProductModal('${product.id}')`}" class="relative scale-95 hover:scale-100 transition-all duration-300 aspect-square overflow-hidden bg-gray-50 cursor-pointer rounded-t-xl">
                            <img src="${firstImg}" onerror="this.src='${fallbackImg}'" class="w-full h-full object-cover">
                            ${isOutOfStock ? `<div class="absolute inset-0 bg-white/50 flex items-center justify-center"><span class="bg-red-600 text-white px-3 py-1 text-[10px] font-black uppercase rounded shadow-sm">Out of Stock</span></div>` : ''}
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white px-2 py-0.5 rounded-md text-[10px] font-bold">
                                📷 ${product.images.length} Photos
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div onclick="${isOutOfStock ? '' : `openProductModal('${product.id}')`}" class="cursor-pointer">
                                <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${product.name}</h3>
                                <span class="text-[10px] bg-orange-50 text-orange-600 font-bold px-2 py-0.5 rounded mt-1 inline-block">${product.category}</span>
                            </div>
                            <div class="mt-3 flex items-center justify-between">
                                <p class="text-gray-900 font-black text-base">₹${product.price}</p>
                                ${actionBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            updateCartUI();
        }

        function changeQuantityDirect(productId, change) {
            const product = products.find(p => p.id === productId);
            if(!product) return;
            if(!cart[productId]) cart[productId] = 0;
            
            const newQty = cart[productId] + change;
            if (newQty > product.stockQuantity) {
                alert(`⚠️ Maaf kijiye, is item ka sirf ${product.stockQuantity} stock hi bacha hai.`);
                return;
            }

            cart[productId] = newQty;
            if(cart[productId] <= 0) delete cart[productId];
            
            renderProducts(); 
        }

        // 🔄 Premium horizontal manual swiping & scrolling slider engine
        function startAutoSlider(totalImages) {
            stopAutoSlider(); 
            if (totalImages <= 1) return;
            const slider = document.getElementById('modalImageSlider');
            let currentIndex = 0;
            autoSlideInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalImages;
                if(slider) {
                    slider.scrollLeft = currentIndex * slider.clientWidth;
                    updateSliderDots(currentIndex);
                }
            }, 3500);
        }

        function stopAutoSlider() {
            if (autoSlideInterval) { clearInterval(autoSlideInterval); autoSlideInterval = null; }
        }

        function updateSliderDots(index) {
            const dots = document.querySelectorAll('.slider-dot');
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.remove('bg-gray-300', 'w-2'); dot.classList.add('bg-orange-600', 'w-4');
                } else {
                    dot.classList.remove('bg-orange-600', 'w-4'); dot.classList.add('bg-gray-300', 'w-2');
                }
            });
        }

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;
            
            trackProductClick(id); // Analytics views count trigger
            
            // Native full wide scroll structure (Customer can manually scroll/swipe anytime)
            let imagesHtml = product.images.map(img => `
                <div class="w-full flex-shrink-0 snap-center flex items-center justify-center bg-black min-w-full">
                    <img src="${img}" onerror="this.src='${fallbackImg}'" class="w-full max-h-[70vh] object-contain">
                </div>
            `).join('');
            
            let dotsHtml = product.images.map((_, i) => `<span class="slider-dot h-2 rounded-full transition-all duration-300 ${i === 0 ? 'bg-orange-600 w-4' : 'bg-gray-300 w-2'}"></span>`).join('');

            document.getElementById('modalContent').innerHTML = `
                <div class="relative w-full overflow-hidden bg-black">
                    <div id="modalImageSlider" class="slider-container w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth">
                        ${imagesHtml}
                    </div>
                    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-1.5 bg-white/75 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md z-10">
                        ${dotsHtml}
                    </div>
                </div>
                <div class="p-5 bg-white rounded-t-3xl -mt-4 relative z-10">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <h2 class="text-2xl font-extrabold text-gray-900 leading-tight">${product.name}</h2>
                        <span class="bg-blue-50 text-blue-700 text-[10px] font-black px-2 py-1 rounded shadow-sm flex-shrink-0">📦 Stock: ${product.stockQuantity}</span>
                    </div>
                    <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${product.category}</span>
                    <div class="border-t border-gray-100 pt-4 mt-4">
                        <h3 class="font-bold text-gray-900 mb-2">Description</h3>
                        <p class="text-gray-600 text-sm leading-relaxed whitespace-pre-line">${product.description}</p>
                    </div>
                </div>
            `;
            
            updateModalFooterControls(product.id);
            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(0)';
            
            // Initialize manual swipe event listeners
            startAutoSlider(product.images.length);

            const sliderEl = document.getElementById('modalImageSlider');
            sliderEl.addEventListener('scroll', () => {
                const index = Math.round(sliderEl.scrollLeft / sliderEl.clientWidth);
                updateSliderDots(index);
            });

            // Stop auto animation as soon as user touches/scrolls image manually
            sliderEl.addEventListener('touchstart', stopAutoSlider, { passive: true });
        }

        function updateModalFooterControls(productId) {
            const container = document.getElementById('modalActionContainer');
            const product = products.find(p => p.id === productId);
            const qty = cart[productId] || 0;

            const displayPrice = qty > 0 ? (product.price * qty) : product.price;
            document.getElementById('modalPrice').innerText = `₹${displayPrice}`;

            if(qty === 0) {
                container.innerHTML = `
                    <button onclick="changeQuantityFromModal('${productId}', 1)" class="bg-gray-900 text-white rounded-xl font-bold text-sm px-8 py-3.5 hover:bg-black active:scale-95 transition shadow-lg">
                        Add Item 🛒
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <div class="flex items-center bg-gray-100 rounded-xl p-1 border border-gray-200 shadow-inner">
                        <button onclick="changeQuantityFromModal('${productId}', -1)" class="bg-white text-gray-900 w-10 h-10 rounded-lg font-black text-lg flex items-center justify-center hover:bg-gray-50 active:scale-90 transition shadow-sm">-</button>
                        <span class="px-5 font-extrabold text-gray-900 text-base min-w-[40px] text-center">${qty}</span>
                        <button onclick="changeQuantityFromModal('${productId}', 1)" class="bg-white text-gray-900 w-10 h-10 rounded-lg font-black text-lg flex items-center justify-center hover:bg-gray-50 active:scale-90 transition shadow-sm">+</button>
                    </div>
                `;
            }
        }

        function changeQuantityFromModal(productId, change) {
            const product = products.find(p => p.id === productId);
            if(!cart[productId]) cart[productId] = 0;
            
            const isFirstAdd = cart[productId] === 0 && change > 0;
            const newQty = cart[productId] + change;
            
            if (newQty > product.stockQuantity) {
                alert(`⚠️ Maaf kijiye, is item ka sirf ${product.stockQuantity} stock hi bacha hai.`);
                return;
            }

            cart[productId] = newQty;
            if(cart[productId] <= 0) delete cart[productId];
            
            renderProducts(); 
            updateModalFooterControls(productId);

            if(isFirstAdd) {
                closeProductModal();
            }
        }

        function closeProductModal() {
            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(100%)';
            stopAutoSlider(); 
        }

        function updateCartUI() {
            let total = 0;
            let itemCount = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    total += (product.price * qty);
                    itemCount += qty;
                }
            }
            document.getElementById('cartTotal').innerText = `₹${total}`;
            const cartBar = document.getElementById('cartBar');
            if(itemCount > 0) {
                cartBar.style.transform = 'translateX(-50%) translateY(0)';
            } else {
                cartBar.style.transform = 'translateX(-50%) translateY(100%)';
            }
        }

        function openCheckoutModal() {
            if (Object.keys(cart).length === 0) return;
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        async function submitOrder() {
            const customerName = document.getElementById('custName').value;
            if(!customerName.trim()) { alert("Bhai, apna naam toh likho!"); return; }

            const submitBtn = document.getElementById('finalOrderBtn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Processing Order... ⏳";
            submitBtn.disabled = true;

            let total = 0;
            let orderItems = [];
            let waMessage = `*New Order Placed!* 🛍️\nCustomer: ${customerName}\nStore: ${realShopName}\n\n`;

            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    let itemTotal = product.price * qty;
                    total += itemTotal;
                    orderItems.push({ productId: id, name: product.name, price: product.price, quantity: qty });
                    waMessage += `▪️ ${product.name} (x${qty}) - ₹${itemTotal}\n`;
                }
            }
            waMessage += `\n*Total Amount: ₹${total}*\n\nPlease process my order.`;

            try {
                const response = await fetch('/api/orders/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopSlug: storeId, customerName: customerName, items: orderItems, totalAmount: total })
                });

                const data = await response.json();

                if(response.ok) {
                    const whatsappUrl = `https://wa.me/${dynamicVendorPhone}?text=${encodeURIComponent(waMessage)}`;
                    window.location.href = whatsappUrl;
                } else {
                    alert("⚠️ Database me save nahi hua: " + data.message);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alert("⚠️ Order process nahi ho paya, kripya internet check karein.");
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        }

        // ==========================================
        // 🕵️‍♂️ SMART TRACKING SYSTEM
        // ==========================================
        let sessionStartTime = Date.now();
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'hidden') {
                let timeSpent = Math.floor((Date.now() - sessionStartTime) / 1000); 
                if(timeSpent > 2) { 
                    let data = JSON.stringify({ shopSlug: storeId, timeSpentSeconds: timeSpent });
                    navigator.sendBeacon('/api/analytics/track-time', new Blob([data], { type: 'application/json' }));
                }
            }
        });

        function trackProductClick(productId) {
            fetch('/api/analytics/track-product', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: productId })
            });
        }

        fetchShopDetails();
        fetchProducts();
    </script>
</body>
</html>
