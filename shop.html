<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #e5e7eb; /* Desktop par bahar ka background */
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">

        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="px-4 py-4 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-extrabold text-orange-500 uppercase tracking-widest">Welcome to</p>
                    <h1 id="storeName" class="text-xl font-extrabold text-gray-900 truncate max-w-[200px]">Loading Store...</h1>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-full border border-gray-100 shadow-sm">
                    🏪
                </div>
            </div>
            
            <div class="px-4 pb-4">
                <div class="bg-gray-100 rounded-xl px-4 py-2.5 flex items-center gap-2">
                    <span class="text-gray-400">🔍</span>
                    <input type="text" placeholder="Search for products..." class="bg-transparent outline-none w-full text-sm font-medium">
                </div>
            </div>
        </header>

        <div class="px-4 py-3 flex gap-3 overflow-x-auto no-scrollbar bg-white border-b border-gray-200">
            <button class="bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-md">All Items</button>
            <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap border border-gray-200 hover:bg-gray-50">Festival</button>
            <button class="bg-white text-gray-600 px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap border border-gray-200 hover:bg-gray-50">Sweets</button>
        </div>

        <main class="p-4 grid grid-cols-2 gap-4" id="productList">
            </main>

        <div id="cartBar" 
             class="fixed bottom-0 left-1/2 w-full max-w-md bg-white border-t border-gray-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] transition-all duration-300 flex justify-between items-center z-40"
             style="transform: translateX(-50%) translateY(100%);">
            <div class="flex flex-col">
                <span class="text-[11px] text-gray-500 font-bold uppercase tracking-wider">Total Amount</span>
                <span class="text-xl font-black text-gray-900" id="cartTotal">₹0</span>
            </div>
            <button onclick="checkoutToWhatsApp()" class="bg-orange-600 text-white px-6 py-3.5 rounded-xl font-bold shadow-lg hover:bg-orange-700 active:scale-95 transition-all flex items-center gap-2">
                <span>Order</span> 📲
            </button>
        </div>

        <div id="productModal" 
             class="fixed inset-y-0 left-1/2 w-full max-w-md bg-white z-50 flex flex-col transition-all duration-300"
             style="transform: translateX(-50%) translateY(100%);">
            
            <div class="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-4 flex justify-between items-center z-10 border-b border-gray-100">
                <button onclick="closeProductModal()" class="bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-sm active:scale-90 transition">
                    ←
                </button>
                <span class="font-bold text-gray-900">Product Details</span>
                <div class="w-10"></div> 
            </div>

            <div id="modalContent" class="flex-1 overflow-y-auto pb-24"></div>

            <div class="sticky bottom-0 bg-white border-t border-gray-100 p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] flex gap-4">
                <div class="flex-1">
                    <p class="text-xs text-gray-500 font-bold uppercase">Price</p>
                    <p id="modalPrice" class="text-2xl font-black text-gray-900">₹0</p>
                </div>
                <button id="modalAddToCartBtn" class="flex-[2] bg-gray-900 text-white rounded-xl font-bold text-sm hover:bg-black active:scale-95 transition shadow-lg flex items-center justify-center">
                    Add to Cart 🛒
                </button>
            </div>
        </div>

    </div> 
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');
        let dynamicVendorPhone = ""; 
        let realShopName = "";
        let products = []; // Ab ye Array Database se aayega!

        // Fetch Shop Info
        async function fetchShopDetails() {
            if(!storeId) {
                document.getElementById('storeName').innerText = "Store ID Missing";
                return;
            }
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/shop/${storeId}`);
                const data = await response.json();
                if(response.ok) {
                    realShopName = data.shopName;
                    document.getElementById('storeName').innerText = realShopName;
                    dynamicVendorPhone = "91" + data.mobileNumber; 
                }
            } catch (error) {
                console.error("Error fetching shop details:", error);
            }
        }

        // Fetch Dynamic Products from Database
        async function fetchProducts() {
            if(!storeId) return;
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/products/${storeId}`);
                const data = await response.json();
                
                if(response.ok && data.length > 0) {
                    products = data.map(p => ({
                        id: p._id,
                        name: p.name,
                        price: p.price,
                        images: [p.image || "https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500&q=80"],
                        description: p.description || "No description provided.",
                        rating: 4.8,
                        reviews: 12
                    }));
                } else {
                    products = []; // No items added yet
                }
                renderProducts();
            } catch (error) {
                console.error("Error fetching products:", error);
            }
        }

        let cart = {}; 

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            if(products.length === 0) {
                list.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 font-medium">Abhi koi item add nahi hua hai.</div>`;
                return;
            }

            products.forEach(product => {
                const qty = cart[product.id] || 0;
                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col relative group cursor-pointer" onclick="openProductModal('${product.id}')">
                        <div class="relative aspect-square overflow-hidden bg-gray-50">
                            <img src="${product.images[0]}" class="w-full h-full object-cover">
                            ${qty > 0 ? `<div class="absolute top-2 right-2 bg-orange-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shadow-md">${qty}</div>` : ''}
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${product.name}</h3>
                                <div class="flex items-center gap-1 mt-1">
                                    <span class="text-yellow-400 text-xs">★</span>
                                    <span class="text-xs text-gray-500 font-semibold">${product.rating}</span>
                                </div>
                            </div>
                            <p class="text-gray-900 font-black text-lg mt-2">₹${product.price}</p>
                        </div>
                    </div>
                `;
            });
            updateCartUI();
        }

        // Modal Logic
        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            if(!product) return;

            let imagesHtml = `<img src="${product.images[0]}" class="w-full h-auto aspect-square object-cover flex-shrink-0 snap-center">`;

            document.getElementById('modalContent').innerHTML = `
                <div class="w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar bg-gray-50">
                    ${imagesHtml}
                </div>
                <div class="p-5">
                    <h2 class="text-2xl font-extrabold text-gray-900 leading-tight mb-2">${product.name}</h2>
                    <div class="flex items-center gap-2 mb-6">
                        <div class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold flex items-center gap-1">
                            ${product.rating} ★
                        </div>
                    </div>
                    <div class="border-t border-gray-100 pt-5">
                        <h3 class="font-bold text-gray-900 mb-2">Details</h3>
                        <p class="text-gray-600 text-sm leading-relaxed">${product.description}</p>
                    </div>
                </div>
            `;

            document.getElementById('modalPrice').innerText = `₹${product.price}`;
            
            const btn = document.getElementById('modalAddToCartBtn');
            btn.onclick = () => {
                updateCart(product.id, 1);
                closeProductModal(); 
            };

            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(0)';
        }

        function closeProductModal() {
            const modal = document.getElementById('productModal');
            modal.style.transform = 'translateX(-50%) translateY(100%)';
        }

        function updateCart(productId, change) {
            if(!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if(cart[productId] <= 0) delete cart[productId];
            renderProducts(); 
        }

        function updateCartUI() {
            let total = 0;
            let itemCount = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    total += (product.price * qty);
                    itemCount += qty;
                }
            }
            document.getElementById('cartTotal').innerText = `₹${total}`;
            const cartBar = document.getElementById('cartBar');
            if(itemCount > 0) {
                cartBar.style.transform = 'translateX(-50%) translateY(0)';
            } else {
                cartBar.style.transform = 'translateX(-50%) translateY(100%)';
            }
        }

        function checkoutToWhatsApp() {
            if(!dynamicVendorPhone) {
                alert("Loading details...");
                return;
            }
            let message = `*New Booking / Order Details* 🛍️\nStore: ${realShopName}\n\n`;
            let total = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const product = products.find(p => p.id == id);
                if(product) {
                    let itemTotal = product.price * qty;
                    message += `▪️ ${product.name} (x${qty}) - ₹${itemTotal}\n`;
                    total += itemTotal;
                }
            }
            message += `\n*Total Bill: ₹${total}*\n\nPlease process this.`;
            const whatsappUrl = `https://wa.me/${dynamicVendorPhone}?text=${encodeURIComponent(message)}`;
            window.location.href = whatsappUrl;
        }

        fetchShopDetails();
        fetchProducts();
    </script>
</body>
</html>
