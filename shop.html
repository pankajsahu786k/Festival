<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e5e7eb; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-50 min-h-screen relative shadow-2xl flex flex-col pb-24 overflow-x-hidden">
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="px-4 py-4 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-extrabold text-orange-500 uppercase tracking-widest">Welcome to</p>
                    <h1 id="storeName" class="text-xl font-extrabold text-gray-900 truncate max-w-[200px]">Loading Store...</h1>
                </div>
                <div class="bg-gray-50 p-2.5 rounded-full border border-gray-100 shadow-sm">🏪</div>
            </div>
        </header>

        <main class="p-4 grid grid-cols-2 gap-4" id="productList"></main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');
        let products = [];

        async function fetchShopDetails() {
            if(!storeId) return;
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/shop/${storeId}`);
                const data = await response.json();
                if(response.ok) {
                    document.getElementById('storeName').innerText = data.shopName;
                }
            } catch (error) { console.error(error); }
        }

        async function fetchProducts() {
            if(!storeId) return;
            try {
                const response = await fetch(`https://festival-h6ff.onrender.com/api/products/${storeId}`);
                const data = await response.json();
                
                if(response.ok && data.length > 0) {
                    products = data;
                }
                renderProducts();
            } catch (error) { console.error(error); }
        }

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            if(products.length === 0) {
                list.innerHTML = `<div class="col-span-2 text-center py-10 text-gray-400 font-medium">Koi item list nahi hua hai.</div>`;
                return;
            }

            products.forEach(product => {
                // Safely load first image
                let firstImg = (product.images && product.images.length > 0) ? product.images[0] : 'https://via.placeholder.com/500?text=No+Image';
                
                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col cursor-pointer">
                        <div class="relative aspect-square overflow-hidden bg-gray-50">
                            <img src="${firstImg}" onerror="this.src='https://via.placeholder.com/500?text=Error'" class="w-full h-full object-cover">
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white px-2 py-0.5 rounded-md text-[10px] font-bold">
                                📷 ${product.images ? product.images.length : 0} Photos
                            </div>
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm leading-tight line-clamp-2">${product.name}</h3>
                                <span class="text-[10px] bg-orange-50 text-orange-600 font-bold px-2 py-0.5 rounded mt-1 inline-block">${product.category}</span>
                            </div>
                            <p class="text-gray-900 font-black text-lg mt-2">₹${product.price}</p>
                        </div>
                    </div>
                `;
            });
        }

        fetchShopDetails();
        fetchProducts();
    </script>
</body>
</html>
