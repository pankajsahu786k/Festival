<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <button onclick="window.close(); window.history.back();" class="bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition">⬅️ Back</button>
            <h1 class="text-xl font-black tracking-tight" id="headerShopName">Loading...</h1>
            <button class="bg-orange-100 text-orange-600 p-2 rounded-full hover:bg-orange-200 transition shadow-sm">📞 Call</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto bg-white min-h-screen shadow-sm relative">
        
        <div id="galleryContainer" class="flex overflow-x-auto gap-4 p-4 no-scrollbar bg-gray-50 hidden snap-x snap-mandatory border-b border-gray-100"></div>

        <div class="p-5 border-b border-gray-100">
            <div class="flex justify-between items-start">
                <div>
                    <h2 id="shopName" class="text-2xl font-black text-gray-900">Loading...</h2>
                    <p id="shopCategory" class="text-sm font-medium text-gray-500 mt-1">...</p>
                </div>
                <div class="bg-green-100 text-green-700 px-3 py-1 rounded-lg flex flex-col items-center justify-center shadow-sm">
                    <span class="text-xs font-bold">⭐ 4.5</span>
                </div>
            </div>
            <div class="p-5 border-b border-gray-100 bg-white hidden" id="mapSection">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-extrabold text-gray-900">Store Location 📍</h3>
                <a id="getDirectionsBtn" href="#" target="_blank" class="text-[11px] font-bold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition shadow-sm border border-blue-100 flex items-center gap-1">
                    Get Directions ↗
                </a>
            </div>
            <div class="w-full h-36 rounded-xl overflow-hidden border border-gray-200 shadow-inner relative bg-gray-50">
                <iframe id="shopMapIframe" width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src=""></iframe>
            </div>
            <p id="shopAddressFull" class="text-xs text-gray-500 font-medium mt-2 leading-relaxed flex gap-1">
                <span class="text-gray-400">🏠</span> <span id="addressText">Address yahan aayega...</span>
            </p>
        </div>
            <div class="mt-4 flex gap-3 text-xs font-bold text-gray-500 bg-gray-50 p-3 rounded-xl border border-gray-100">
                <span class="flex items-center gap-1">🛵 30-40 mins</span>
                <span>•</span>
                <span class="flex items-center gap-1">📍 <span id="distanceText">View Map</span></span>
            </div>
        </div>

        <div class="p-5">
            <h3 class="text-lg font-extrabold mb-4 flex items-center gap-2">Recommended 👨‍🍳</h3>
            <div id="menuContainer" class="space-y-6">
                <p class="text-center text-gray-500 text-sm py-10 font-medium">Menu load ho raha hai... ⏳</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] p-4 z-40">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 font-bold uppercase">Your Order</p>
                <p class="text-lg font-black text-gray-900"><span id="cartCount">0</span> Items | ₹<span id="cartTotal">0</span></p>
            </div>
            <button class="bg-orange-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-orange-700 transition shadow-md flex items-center gap-2">
                View Cart 🛒
            </button>
        </div>
    </div>

    <div id="imageModal" class="fixed inset-0 z-[100] bg-black/95 hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white p-3 bg-white/10 rounded-full hover:bg-white/20 transition active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="modalImage" src="" class="max-w-[95vw] max-h-[85vh] object-contain rounded-xl shadow-2xl">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopSlug = urlParams.get('store');

        if (!shopSlug) {
            alert("Galat URL! Dukaan nahi mili.");
            window.location.href = 'index.html';
        }

        // 🏪 1. Fetch Shop Info & Set Map (FINAL CORRECTED MAP URLs)
        // 🏪 1. Fetch Shop Info & Set Map (EXACT GPS LOCATION FIX)
        async function fetchShopInfo() {
            try {
                const res = await fetch(`/api/shop/${shopSlug}`);
                if (res.ok) {
                    const shop = await res.json();
                    
                    document.getElementById('headerShopName').innerText = shop.shopName;
                    document.getElementById('shopName').innerText = shop.shopName;
                    document.getElementById('shopCategory').innerText = shop.category || "Food Outlet";
                    
                    // 🗺️ SMART MAP ENGINE (Priority to exact Lat/Long)
                    let mapQuery = "";
                    
                    if (shop.latitude && shop.longitude) {
                        // 📍 Yahan hum direct GPS coordinates use kar rahe hain
                        mapQuery = `${shop.latitude},${shop.longitude}`;
                    } else if (shop.address) {
                        // Agar GPS nahi hai, tabhi address pe jayega
                        mapQuery = encodeURIComponent(shop.address);
                    } else {
                        mapQuery = encodeURIComponent(shop.shopName + " Bhopal"); 
                    }

                    // 1. Google Map Embed iframe (✅ STANDARD FORMAT FOR EXACT PIN)
                    const finalMapUrl = `https://maps.google.com/maps?q=${mapQuery}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
                    document.getElementById('shopMapIframe').src = finalMapUrl;
                    
                    // 2. Direct Phone Navigation Link (✅ STANDARD GOOGLE DIRECTIONS URL)
                    const finalDirUrl = `https://www.google.com/maps/dir/?api=1&destination=${mapQuery}`;
                    document.getElementById('getDirectionsBtn').href = finalDirUrl;
                    
                    // 3. Address dikhana
                    if (shop.address) {
                        document.getElementById('addressText').innerText = shop.address;
                    } else {
                        document.getElementById('shopAddressFull').classList.add('hidden');
                    }
                    
                    // Map section ko visible kardo
                    document.getElementById('mapSection').classList.remove('hidden');
                }
            } catch (error) { 
                console.error("Error loading shop info"); 
            }
        }

        // 📸 2. Fetch & Render Gallery
        async function fetchGallery() {
            try {
                const res = await fetch(`/api/vendor/gallery/${shopSlug}`);
                if (res.ok) {
                    const data = await res.json();
                    const photos = data.galleryPhotos || [];
                    const container = document.getElementById('galleryContainer');
                    if (photos.length > 0) {
                        container.innerHTML = photos.map(img => `
                            <img src="${img}" onclick="openModal('${img}')" class="w-[85vw] md:w-80 h-56 object-cover rounded-2xl shadow-sm flex-shrink-0 snap-center border border-gray-200 cursor-pointer active:scale-[0.98] transition">
                        `).join('');
                        container.classList.remove('hidden'); 
                        startAutoScroll();
                    }
                }
            } catch (error) { console.error("Error loading gallery"); }
        }

        let scrollInterval;
        function startAutoScroll() {
            const container = document.getElementById('galleryContainer');
            scrollInterval = setInterval(() => {
                if (container.scrollWidth === 0) return;
                const maxScroll = container.scrollWidth - container.clientWidth;
                if (container.scrollLeft >= maxScroll - 10) {
                    container.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    container.scrollBy({ left: 320, behavior: 'smooth' });
                }
            }, 3000); 
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            document.getElementById('modalImage').src = imgSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            clearInterval(scrollInterval);
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('modalImage').src = ""; 
                startAutoScroll();
            }, 300);
        }

        // 🛒 3. CART SYSTEM ENGINE
        let allProducts = [];
        let cart = {}; 

        async function fetchMenu() {
            try {
                const res = await fetch(`/api/products/${shopSlug}`);
                allProducts = await res.json();
                const container = document.getElementById('menuContainer');

                if (allProducts.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-10 font-medium italic">Abhi menu add nahi kiya gaya hai.</p>';
                    return;
                }

                container.innerHTML = allProducts.map(item => {
                    // Premium Diet Icons
                    let dietIcon = '<div class="flex items-center justify-center w-4 h-4 border-2 border-green-600 rounded-sm"><div class="w-2 h-2 bg-green-600 rounded-full"></div></div>';
                    if(item.description.includes('[Non-Veg]')) dietIcon = '<div class="flex items-center justify-center w-4 h-4 border-2 border-red-600 rounded-sm"><div class="w-2 h-2 bg-red-600 rounded-full"></div></div>';
                    if(item.description.includes('[Egg]')) dietIcon = '<div class="flex items-center justify-center w-4 h-4 border-2 border-yellow-500 rounded-sm"><div class="w-2 h-2 bg-yellow-500 rounded-full"></div></div>';
                    
                    let cleanDesc = item.description.replace(/\[.*?\] /, '');
                    let imgSrc = item.images && item.images[0] ? item.images[0] : 'https://via.placeholder.com/150';

                    return `
                    <div class="bg-white rounded-2xl p-4 mb-4 flex justify-between items-center gap-4 border border-gray-100 shadow-[0_2px_15px_rgba(0,0,0,0.04)] hover:shadow-lg transition-all duration-300 relative overflow-hidden">
                        <div class="flex-1 pr-2">
                            <div class="flex items-center gap-2 mb-2">
                                ${dietIcon}
                                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">${item.category}</span>
                            </div>
                            <h4 class="font-extrabold text-gray-900 text-[17px] leading-tight mb-1">${item.name}</h4>
                            <p class="font-black text-gray-800 text-base mb-2">₹${item.price}</p>
                            <p class="text-sm text-gray-500 line-clamp-2 leading-relaxed">${cleanDesc}</p>
                        </div>
                        <div class="relative w-36 h-36 flex-shrink-0 rounded-2xl overflow-hidden shadow-sm bg-gray-50 border border-gray-100">
                            <img src="${imgSrc}" onclick="openModal('${imgSrc}')" class="w-full h-full object-cover cursor-pointer hover:scale-110 transition duration-500">
                            <div id="cart-btn-${item._id}" class="absolute bottom-2 left-1/2 -translate-x-1/2 w-full flex justify-center">
                                <button onclick="updateCart('${item._id}', 1)" class="bg-white/95 backdrop-blur-md text-green-600 border border-green-100 font-black text-sm px-6 py-2 rounded-xl shadow-lg hover:bg-green-50 hover:text-green-700 transition uppercase active:scale-95 flex items-center gap-1">
                                    ADD <span class="text-green-600 text-lg leading-none">+</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('menuContainer').innerHTML = '<p class="text-red-500 text-center font-bold">Menu load nahi paya.</p>';
            }
        }

        function updateCart(itemId, change) {
            const product = allProducts.find(p => p._id === itemId);
            if(!product) return;

            if(!cart[itemId]) cart[itemId] = { name: product.name, price: parseInt(product.price), qty: 0 };
            
            cart[itemId].qty += change;
            if(cart[itemId].qty <= 0) delete cart[itemId];

            renderItemButton(itemId);
            updateGlobalCartUI();
        }

        function renderItemButton(itemId) {
            const btnContainer = document.getElementById(`cart-btn-${itemId}`);
            if(!btnContainer) return;

            if (cart[itemId] && cart[itemId].qty > 0) {
                btnContainer.innerHTML = `
                    <div class="bg-white/95 backdrop-blur-md border border-green-200 shadow-lg rounded-xl flex items-center justify-between px-1 w-28 h-9">
                        <button onclick="updateCart('${itemId}', -1)" class="text-gray-600 font-black text-xl px-3 hover:text-red-500 transition active:scale-90">-</button>
                        <span class="text-green-700 font-black text-[15px]">${cart[itemId].qty}</span>
                        <button onclick="updateCart('${itemId}', 1)" class="text-green-600 font-black text-xl px-3 hover:text-green-800 transition active:scale-90">+</button>
                    </div>
                `;
            } else {
                btnContainer.innerHTML = `
                    <button onclick="updateCart('${itemId}', 1)" class="bg-white/95 backdrop-blur-md text-green-600 border border-green-100 font-black text-sm px-6 py-2 rounded-xl shadow-lg hover:bg-green-50 hover:text-green-700 transition uppercase active:scale-95 flex items-center gap-1">
                        ADD <span class="text-green-600 text-lg leading-none">+</span>
                    </button>
                `;
            }
        }

        function updateGlobalCartUI() {
            let totalItems = 0;
            let totalPrice = 0;
            for(let id in cart) {
                totalItems += cart[id].qty;
                totalPrice += (cart[id].price * cart[id].qty);
            }
            document.getElementById('cartCount').innerText = totalItems;
            document.getElementById('cartTotal').innerText = totalPrice;

            const cartBar = document.querySelector('.fixed.bottom-0');
            cartBar.classList.add('translate-y-[-10px]');
            setTimeout(() => cartBar.classList.remove('translate-y-[-10px]'), 200);
        }

        // Initialize All Functions
        fetchShopInfo();
        fetchGallery();
        fetchMenu();
    </script>
</body>
</html>
