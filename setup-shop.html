<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Shop Profile - SmartShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="text-center mb-8">
            <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Step 2 of 2</span>
            <h2 class="text-3xl font-extrabold text-gray-900 mt-3">Apni Shop ki Details Bharein</h2>
            <p class="text-gray-500 text-sm mt-1">Grahak aapki dukaan aur kaam ko aasaani se samajh sakein.</p>
        </div>

        <form id="setupForm" class="space-y-6">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Aapki Dukaan/Business ka Type kya hai?</label>
                <select id="storeType" required class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition text-sm font-medium cursor-pointer">
                    <option value="" disabled selected>Type select karein...</option>
                    <option value="retail">🛍️ Retail Store (Products / Saman)</option>
                    <option value="food">🍔 Food Outlet (Restaurant / Cafe / Bakery)</option>
                    <option value="service">🛠️ Service Provider (Salon / Repair / Plumber etc.)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Aapki exact Category kya hai?</label>
                <select id="category" required class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition text-sm font-medium cursor-pointer">
                    <option value="" disabled selected>Loading Categories... ⏳</option>
                </select>
            </div>

            <div id="otherCategoryBox" class="hidden p-4 bg-orange-50 border border-orange-100 rounded-xl">
                <label class="block text-sm font-bold text-gray-900 mb-2">Apni Nayi Category Likhain ✍️</label>
                <input type="text" id="customCategory" placeholder="E.g. Hardware, Sofa Cleaning..." 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition text-sm font-medium">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Dukaan ka Pura Pata (Address / Location)</label>
                <input type="text" id="address" placeholder="E.g. Shop No. 12, Main Market, MP Nagar, Bhopal" required
                    class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition text-sm font-medium">
            </div>

            <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                <label class="block text-sm font-bold text-gray-900 mb-2">Exact Map Location (Hyperlocal Search) 📍</label>
                <p class="text-xs text-gray-600 mb-3">Customer ko unke ghar ke paas ki dukaan dikhane ke liye aapki exact location chahiye.</p>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="button" id="getLocationBtn" class="bg-gray-900 text-white font-bold text-sm px-5 py-3.5 rounded-xl hover:bg-black transition flex items-center justify-center gap-2 flex-shrink-0 shadow-md">
                        📍 Detect My Shop
                    </button>
                    <input type="text" id="locationDisplay" placeholder="Click 'Detect My Shop' button ➡️" readonly required
                        class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-100 outline-none text-sm font-bold text-gray-500 cursor-not-allowed">
                </div>
                <p id="locationError" class="text-xs text-red-600 font-bold mt-2 hidden">⚠️ Location error message here.</p>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Shop Description (Optional)</label>
                <textarea id="description" rows="3" placeholder="Apni dukaan ya services ke baare mein kuch lines likhein..."
                    class="w-full px-4 py-3.5 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none transition text-sm font-medium"></textarea>
            </div>

            <button type="submit" 
                class="w-full bg-orange-600 text-white font-bold text-sm py-4 rounded-xl hover:bg-orange-700 active:scale-[0.99] transition shadow-md shadow-orange-600/10 flex justify-center items-center gap-2">
                Save & Continue to Dashboard 🚀
            </button>

        </form>
    </div>

    <script>
        // 🌟 1. SMART & DYNAMIC CATEGORY LOGIC 🌟
        const storeTypeSelect = document.getElementById('storeType');
        const categorySelect = document.getElementById('category');
        const otherCategoryBox = document.getElementById('otherCategoryBox');
        const customCategoryInput = document.getElementById('customCategory');

        // Default categories (Taaki shuruwat me list khali na rahe)
        const defaultCategories = {
            retail: [
                "Grocery & Kirana Store", "Clothing & Fashion", "Electronics & Mobile Accessories",
                "Hardware, Paint & Tools", "Medical & Pharmacy", "Footwear & Shoes",
                "Cosmetics & Beauty Products", "Stationery & Books"
            ],
            food: [
                "Restaurant & Dine-in", "Cafe & Coffee Shop", "Bakery & Cake Shop",
                "Fast Food & Snacks", "Sweet Shop (Mithai)", "Juice & Beverages"
            ],
            service: [
                "Salon, Parlour & Spa", "Mobile & Laptop Repair", "Plumber, Electrician & Carpenter",
                "Event, Tent & Decoration", "Real Estate & Brokerage", "Tailor & Boutique"
            ]
        };

        let dbDynamicCategories = [];

        // 🔄 Backend se categories fetch karna (Page Load par)
        async function fetchDynamicCategories() {
            try {
                const res = await fetch('/api/categories');
                if(res.ok) {
                    dbDynamicCategories = await res.json(); 
                }
            } catch (e) {
                console.log("Dynamic categories load nahi ho paayi.");
            }
        }
        
        fetchDynamicCategories();

        // 🔄 Jab Store Type badle, Dropdown update karein
        storeTypeSelect.addEventListener('change', function() {
            const selectedType = this.value;
            
            // Purani list clear karein
            categorySelect.innerHTML = '<option value="" disabled selected>Category chunie...</option>';
            otherCategoryBox.classList.add('hidden');
            customCategoryInput.required = false;

            // 1. Default categories add karein
            if (defaultCategories[selectedType]) {
                defaultCategories[selectedType].forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat; 
                    option.textContent = cat;
                    categorySelect.appendChild(option);
                });
            }

            // 2. Nayi (Dynamic) Categories add karein
            let newAdditions = [];
            
            dbDynamicCategories.forEach(item => {
                // Agar backend smart ho gaya aur {storeType, category} dono bhej raha hai
                if (typeof item === 'object' && item.category && item.storeType) {
                    if (item.storeType === selectedType && !defaultCategories[selectedType].includes(item.category)) {
                        newAdditions.push(item.category);
                    }
                } 
                // Agar backend abhi sirf purane style ka flat array ["Pizza", "Repair"] bhej raha hai
                else if (typeof item === 'string') {
                    const allDefaults = [...defaultCategories.retail, ...defaultCategories.food, ...defaultCategories.service];
                    if (!allDefaults.includes(item) && item.toLowerCase() !== 'other' && item.trim() !== '') {
                        newAdditions.push(item);
                    }
                }
            });

            // Duplicate names hatana aur dropdown me daalna
            if (newAdditions.length > 0) {
                newAdditions = [...new Set(newAdditions)]; // Remove duplicates
                
                const group = document.createElement('optgroup');
                group.label = "🌟 Nayi Categories (User Added)"; // Alag se highlight karega
                
                newAdditions.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    group.appendChild(option);
                });
                
                categorySelect.appendChild(group);
            }

            // 3. Sabse aakhiri me '+ Other' ka option
            const otherOption = document.createElement('option');
            otherOption.value = 'other';
            otherOption.className = 'font-bold text-orange-600';
            otherOption.textContent = '+ Other (Nayi Category Banayein)';
            categorySelect.appendChild(otherOption);
        });

        // 🆕 OTHER CATEGORY BOX LOGIC
        categorySelect.addEventListener('change', function() {
            if (this.value === 'other') {
                otherCategoryBox.classList.remove('hidden');
                customCategoryInput.required = true;
                customCategoryInput.focus();
            } else {
                otherCategoryBox.classList.add('hidden');
                customCategoryInput.required = false;
            }
        });
        // GPS Coordinates Variables
        let shopLat = null;
        let shopLng = null;

        // 📍 Get Location Button Logic
        document.getElementById('getLocationBtn').addEventListener('click', function() {
            const btn = this;
            const display = document.getElementById('locationDisplay');
            const errorMsg = document.getElementById('locationError');

            btn.innerHTML = "Detecting... ⏳";
            errorMsg.classList.add('hidden');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        shopLat = position.coords.latitude;
                        shopLng = position.coords.longitude;
                        
                        display.value = `✅ Lat: ${shopLat.toFixed(4)}, Lng: ${shopLng.toFixed(4)}`;
                        display.classList.remove('bg-gray-100', 'text-gray-500');
                        display.classList.add('bg-green-50', 'border-green-300', 'text-green-700');
                        
                        btn.innerHTML = "📍 Shop Located";
                        btn.classList.replace('bg-gray-900', 'bg-green-600');
                        btn.classList.replace('hover:bg-black', 'hover:bg-green-700');
                        btn.disabled = true;
                    },
                    (error) => {
                        btn.innerHTML = "📍 Detect My Shop";
                        errorMsg.classList.remove('hidden');
                        if(error.code === 1) {
                            errorMsg.innerText = "⚠️ Aapne Location permission allow nahi ki hai. Kripya URL bar me lock icon par click karke Location Allow karein.";
                        } else {
                            errorMsg.innerText = "⚠️ Location track nahi ho paayi. Apna GPS chalu rakhein aur try karein.";
                        }
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Aapka browser ya mobile location ko support nahi karta.");
                btn.innerHTML = "📍 Detect My Shop";
            }
        });

        // 📝 Submit Form
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if(shopLat === null || shopLng === null) {
                alert("⚠️ Kripya 'Detect My Shop' button par click karke apni dukan ki location set karein!");
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = "Saving Details... ⏳";
            submitBtn.disabled = true;

            const shopSlug = localStorage.getItem('shopSlug');
            
            // 🌟 STORE TYPE GET KARNA
            const storeType = document.getElementById('storeType').value;
            
            let finalCategory = categorySelect.value;
            if (finalCategory === 'other') {
                finalCategory = customCategoryInput.value.trim();
            }

            const address = document.getElementById('address').value;
            const description = document.getElementById('description').value;

            try {
                // Backend me ab 'storeType' bhi bheja jaa raha hai
                const response = await fetch('/api/vendor/setup-shop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        shopSlug, 
                        storeType, // Naya variable
                        category: finalCategory, 
                        address, 
                        description, 
                        latitude: shopLat, 
                        longitude: shopLng 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('isSetupCompleted', 'true');
                    alert('Success: Profile details aur GPS Location save ho gayi hain!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(`Error: ${data.message}`);
                }
            } catch (error) {
                alert('Network Error! Kripya internet connection check karein.');
            } finally {
                submitBtn.innerHTML = "Save & Continue to Dashboard 🚀";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
